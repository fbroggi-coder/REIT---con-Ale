async function parsePDF(arrayBuffer) {
  const pdfjs = await loadPDFJS();
  const pdf   = await pdfjs.getDocument({ data: arrayBuffer }).promise;

  // ── Extraer ítems con posición, agrupar en líneas por y ───────────
  const allItems = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp   = page.getViewport({ scale: 1 });
    const tc   = await page.getTextContent();
    tc.items.forEach(it => {
      allItems.push({ text: it.str.trim(), x: Math.round(it.transform[4]),
                      y: Math.round(vp.height - it.transform[5]) + (p - 1) * 10000, pg: p });
    });
  }

  const lineMap = new Map();
  for (const item of allItems) {
    if (!item.text) continue;
    let placed = false;
    for (const [ky, arr] of lineMap) {
      if (Math.abs(ky - item.y) <= 3) { arr.push(item); placed = true; break; }
    }
    if (!placed) lineMap.set(item.y, [item]);
  }
  const lines = [...lineMap.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([y, items]) => ({
      y,
      text: items.sort((a, b) => a.x - b.x).map(i => i.text).filter(Boolean).join(' '),
      items: items.sort((a, b) => a.x - b.x),
    }));

  console.log('[PDF] páginas:', pdf.numPages, '| líneas:', lines.length);

  const res = { holdings: [], denomMap: {}, fecha: null, navCierre: null, cuotapartes: null, ajustes: [] };
  const numPat = /\d{1,3}(?:\.\d{3})*,\d+/g;
  const fullText = lines.map(l => l.text).join('\n');

  // Normaliza texto quitando acentos para comparaciones de patrones
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

  // Detección temprana de formato
  const isCicloNovaPDF = fullText.includes('IsinCode') && !fullText.includes('Abreviatura');

  // Fecha
  const fechaM = fullText.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
  if (fechaM) res.fecha = fechaM[1];

  // NAV y cuotapartes
  if (isCicloNovaPDF) {
    // CICLO_NOVA: NAV desde "Valor del Día"
    const valorDiaLine = lines.find(l => /valor del d[íi]a/i.test(l.text));
    if (valorDiaLine) {
      const navNums = [...valorDiaLine.text.matchAll(numPat)].map(m => parseArNum(m[0])).filter(n => n > 0);
      if (navNums.length) {
        res.navCierre = navNums[navNums.length - 1];
        console.log('[PDF CICLO_NOVA] NAV cierre:', res.navCierre);
      }
    }
    // CICLO_NOVA: cuotapartes = Clase A + Clase B (última página)
    let cpTotal = 0;
    for (const l of lines) {
      if (/saldo total de cuotapartes/i.test(l.text)) {
        const nums = [...l.text.matchAll(numPat)].map(m => parseArNum(m[0])).filter(n => n > 0);
        if (nums.length) cpTotal += nums[nums.length - 1];
      }
    }
    if (cpTotal > 0) {
      res.cuotapartes = cpTotal;
      console.log('[PDF CICLO_NOVA] Cuotapartes total:', cpTotal);
    }
  } else {
    // REIT / PNIZF: fila "A" en DETALLE
    const detIdx = lines.findIndex(l => l.text.includes('DETALLE') && l.text.includes('GENERACION'));
    if (detIdx !== -1) {
      for (let i = detIdx + 1; i < Math.min(detIdx + 20, lines.length); i++) {
        if (/^A\b/.test(lines[i].text)) {
          const nums = [...lines[i].text.matchAll(numPat)].map(m => parseArNum(m[0])).filter(n => n > 0);
          if (nums.length >= 3) { res.cuotapartes = nums[1]; res.navCierre = nums[2]; }
          break;
        }
      }
    }
  }

  // Ajustes — incluye todos los ítems posibles de todos los fondos.
  // Los que no aparecen en el PDF simplemente no matchean y se ignoran.
  // fmt: 'cn' = solo CICLO_NOVA, 'rp' = solo REIT/PNIZF, undefined = todos
  const ajSpec = [
    { key: '(+) Disponibilidades',              pat: 'DISPONIBILIDADES',          sign:  1 },
    { key: '(+) Otros créditos no corrientes',  pat: 'OTROS CREDITOS NO CORR',    sign:  1, fmt: 'rp' },
    { key: '(+) Bienes de cambio',              pat: 'BIENES DE CAMBIO',          sign:  1 },
    { key: '(+) Cuenta overnight',              pat: 'CUENTA OVERNIGHT',          sign:  1 },
    { key: '(+) Rentas a cobrar',               pat: 'RENTAS A COBRAR',           sign:  1 },
    { key: '(+) Gastos diferidos (honorarios)', pat: 'GASTOS DIFERIDOS',          sign:  1 },
    { key: '(+) Créditos',                      pat: 'CREDITOS',                  sign:  1, fmt: 'cn' },
    { key: '(+) Créditos por aportes',          pat: 'CREDITOSPORAPORTES',        sign:  1, fmt: 'rp' },
    { key: '(+) Bony',                          pat: 'BONY',                      sign:  1, fmt: 'cn' },
    { key: '(+) Deudores por operaciones',      pat: 'DEUDORES POR OPERACION',    sign:  1 },
    { key: '(−) Provisiones',                   pat: 'PROVISIONES',               sign: -1 },
    { key: '(−) Acreedores',                    pat: 'ACREEDORES',                sign: -1 },
    { key: '(−) Honorarios a pagar',            pat: 'HONORARIOS A PAGAR',        sign: -1 },
    { key: '(−) Impuestos a pagar',             pat: 'IMPUESTOSAPAGAR',           sign: -1, fmt: 'rp' },
  ];
  for (const { key, pat, sign, fmt } of ajSpec) {
    // Filtrar por formato de PDF si corresponde
    if (fmt === 'cn' && !isCicloNovaPDF) continue;
    if (fmt === 'rp' &&  isCicloNovaPDF) continue;
    // Quitar espacios de patrón y texto antes de comparar (PDF.js a veces omite espacios
    // internos en palabras largas o multi-palabra, ej: "CUENTA OVERNIGHT" → "CUENTAOVERNIGHT")
    const patNorm = pat.replace(/\s+/g, '');
    const line = lines.find(l => norm(l.text).replace(/\s+/g, '').includes(patNorm));
    if (!line) continue;
    const nums = [...line.text.matchAll(numPat)];
    if (nums.length) {
      // Usar el primer número de la línea (el valor); los siguientes son % del portfolio.
      // Un importe entre paréntesis es negativo: en los (−) se resta igual; en los (+) resta.
      const absVal  = parseArNum(nums[0][0]);
      const antes   = line.text.slice(0, nums[0].index).trimEnd();
      const entreParentesis = antes.endsWith('(');
      const val = sign < 0 ? -absVal : (entreParentesis ? -absVal : absVal);
      res.ajustes.push({ label: entreParentesis && sign > 0 ? key.replace('(+)', '(−)') : key, val });
      console.log('[PDF ajuste]', key, '=', val);
    }
  }

  // Ciclo Nova: conciliar contra "Valor Patrimonial del Fondo" para que PN = inversiones + ajustes
  // exacto (el pasivo del PDF no siempre es igual a la suma de sus líneas).
  if (isCicloNovaPDF) {
    const lnPN  = lines.find(l => /valor patrimonial del fondo/i.test(l.text));
    const lnInv = lines.find(l => /^INVERSIONES\b/.test(norm(l.text).trim()) && [...l.text.matchAll(numPat)].length);
    if (lnPN && lnInv) {
      const pnPDF  = parseArNum([...lnPN.text.matchAll(numPat)][0][0]);
      const invPDF = parseArNum([...lnInv.text.matchAll(numPat)][0][0]);
      const dif = pnPDF - invPDF - res.ajustes.reduce((s, a) => s + a.val, 0);
      res.pnCierre = pnPDF;
      if (Math.abs(dif) > 0.005) {
        res.ajustes.push({ label: '(±) Otros (conciliación con PN del PDF)', val: Math.round(dif * 100) / 100 });
        console.log('[PDF ajuste] conciliación =', dif);
      }
    }
  }

  // ── Buscar la sección INVERSIONES que precede la tabla de datos ───
  // Ignorar el "INVERSIONES" del balance sheet (no tiene Abreviatura/IsinCode cerca)
  let invIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/\bInversiones\b/i.test(lines[i].text)) {
      const ctx = lines.slice(i, i + 8).map(l => l.text).join(' ');
      if (ctx.includes('Abreviatura') || ctx.includes('IsinCode') ||
          (ctx.includes('Denominación') && (ctx.includes('Cantidad') || ctx.includes('Cotización')))) {
        invIdx = i;
        break;
      }
    }
  }
  console.log('[PDF] Tabla INVERSIONES en línea:', invIdx,
    invIdx >= 0 ? lines[invIdx].text.substring(0,60) : 'NO ENCONTRADA');

  if (invIdx === -1) {
    console.warn('[PDF] Sección de inversiones no encontrada.');
    return res;
  }

  // Detectar formato: REIT/PNIZF tiene "Abreviatura", Ciclo Nova tiene "IsinCode"
  const hdrCtx = lines.slice(invIdx, invIdx + 6).map(l => l.text).join(' ');
  const isCicloNova = hdrCtx.includes('IsinCode') && !hdrCtx.includes('Abreviatura');
  console.log('[PDF] Formato:', isCicloNova ? 'CICLO_NOVA' : 'REIT/PNIZF');

  // Fin de sección
  let totIdx = lines.length - 1;
  for (let i = invIdx + 2; i < lines.length; i++) {
    const t = lines[i].text.trim();
    if (t.startsWith('Total Inversiones') ||
        (t.startsWith('Total') && /\d{9,}/.test(t.replace(/\./g, '').replace(/,/g, ''))) ||
        (!isCicloNova && (t.startsWith('(1) Sobre') || t.startsWith('MONEDAS') || t.includes('Todos los importes'))) ||
        (isCicloNova && (t === 'Disponibilidades' || /^Clase (A|B|Ley)$/.test(t) || t.startsWith('La Duration')))) {
      totIdx = i; break;
    }
  }

  // Filas de datos: entre invIdx+1 y totIdx, con al menos 2 números
  const dataLines = lines.slice(invIdx + 1, totIdx).filter(l => {
    const t = l.text.trim();
    if (/^(PRIVADA|PUBLICA|PUBLICA|Inversiones)\b/i.test(t)) return false; // subsection headers
    if (t.includes('Denominación') || t.includes('Abreviatura') || t.includes('IsinCode')) return false;
    return ([...t.matchAll(numPat)] || []).length >= 2;
  });

  console.log('[PDF] Filas de datos:', dataLines.length);

  const usedTickers = new Set();

  for (const line of dataLines) {
    const t = line.text.trim();
    const nums = [...t.matchAll(numPat)].map(m => m[0]);
    let ticker = '', cierre = 0, cantidad = 0;
    const extra = {};

    if (isCicloNova) {
      // ── Formato Ciclo Nova ────────────────────────────────────────
      // Ticker = primera palabra antes de " - "
      const dashIdx = t.indexOf(' - ');
      const firstPart = dashIdx > 0 ? t.substring(0, dashIdx) : t.split(' ')[0];
      ticker = firstPart.trim().split(/\s+/)[0].replace(/^#/, '').replace(/-+$/, '');
      // Saltar filas de subtotales de sección (primer carácter es dígito)
      if (/^\d/.test(ticker) || /[,\.]/.test(ticker)) continue;
      // Saltar cauciones — tienen su propio parser dedicado
      if (/^(APERTURA|CAUCION|PASE)$/.test(ticker)) continue;
      // Columnas: Cantidad | Cierre | Total | % | ...
      // Usamos Total / Cantidad para mayor precisión (precio en moneda del fondo)
      if (nums.length >= 3) {
        cantidad = parseArNum(nums[0]);
        const total = parseArNum(nums[2]);
        cierre = cantidad > 0 && total > 0 ? total / cantidad : parseArNum(nums[1]);
        // Costo: 5ª columna numérica (Cantidad | Cierre | Total | % | Costo | Var%). Entre paréntesis = dato roto del PDF
        if (!t.startsWith('#') && nums.length >= 6) {
          const mCosto = [...t.matchAll(numPat)][4];
          const prev   = t.slice(0, mCosto.index).trimEnd();
          if (!prev.endsWith('(')) extra.costo = parseArNum(mCosto[0]);
        }
        // Vencimiento: en cheques es la 1ª fecha (después viene la de compra); en el resto, la última
        const fechas = [...t.matchAll(/\b(\d{1,2}\/\d{1,2}\/\d{4})\b/g)].map(m => m[1]);
        if (fechas.length) extra.vencimiento = fechaPDFaISO(t.startsWith('#') ? fechas[0] : fechas[fechas.length - 1]);
      } else if (nums.length >= 2) {
        cantidad = parseArNum(nums[0]);
        cierre   = parseArNum(nums[1]);
      }
    } else {
      // ── Formato REIT / PNIZF ─────────────────────────────────────
      // Últimos 3 números: Cotización | Cantidad | Total
      if (nums.length < 3) continue;
      cierre   = parseArNum(nums[nums.length - 3]);
      cantidad = parseArNum(nums[nums.length - 2]);

      // Ticker: última "palabra" antes de los números y el ISIN
      let textPart = t;
      [nums[nums.length-1], nums[nums.length-2], nums[nums.length-3]]
        .forEach(n => { textPart = textPart.replace(n, ' '); });

      const words = textPart.trim().split(/\s+/)
        .filter(w => w && w !== '-' && w !== '(' && w !== ')');
      if (!words.length) continue;

      const lastW = words[words.length - 1];
      const prevW = words.length >= 2 ? words[words.length - 2] : '';
      const isISIN     = /^[A-Z]{2}[A-Z0-9]{10}$/.test(lastW);
      const isTypeCode = ['MM', 'FCI', 'BOND'].includes(lastW);

      ticker = (isISIN || isTypeCode) ? prevW.replace(/^#/, '') : lastW.replace(/^#/, '');
    }

    if (!ticker || cierre <= 0 || cantidad <= 0) {
      console.log('[PDF] Fila ignorada:', t.substring(0, 80));
      continue;
    }

    // Deduplicar (ej. tres tramos UMV)
    if (usedTickers.has(ticker)) {
      const fw = t.split(/\s+/)[0]?.replace(/^#/, '') || '';
      if (fw && fw !== ticker && !usedTickers.has(fw)) {
        ticker = fw;
      } else {
        const cm = t.match(/\((\d{5,})\)/);
        ticker = cm ? ticker + '_' + cm[1] : ticker + '_' + (usedTickers.size + 1);
      }
    }

    usedTickers.add(ticker);
    res.denomMap[ticker] = t.split(/[(\-]/)[0].trim().substring(0, 60);
    res.holdings.push({ ticker, cierre, cantidad, ...extra });
    console.log('[PDF] Holding:', ticker, '| cierre:', cierre, '| cant:', cantidad);
  }

  // ── Cauciones / Aperturas (solo CICLO_NOVA) ──────────────────────────
  if (isCicloNovaPDF) {
    const caucionSecs = [
      { pat: /Aperturas.*Cauciones.*[Dd][oó]lares/i, sufijo: '' },
      { pat: /Aperturas.*Cauciones.*Pesos/i,          sufijo: '_ARS' },
    ];
    const caucionCount = {};
    for (const { pat, sufijo } of caucionSecs) {
      const secIdx = lines.findIndex(l => pat.test(l.text));
      if (secIdx < 0) continue;
      console.log('[PDF] Sección cauciones', sufijo || 'USD', 'en línea:', secIdx);
      for (let i = secIdx + 1; i < Math.min(secIdx + 60, lines.length); i++) {
        const lt = lines[i].text.trim();
        if (!lt) continue;
        // Parar en próxima sección
        // Usar \s después de la keyword: "APERTURA 29/6/..." es dato, "APERTURAS," es header
        if (/^(Aperturas|Disponibilidades|Total\s|La Duration|Clase\s)/i.test(lt) &&
            !/^(APERTURA|CAUCION|PASE)\s/.test(lt)) break;
        if (!/^(APERTURA|CAUCION|PASE)\s/i.test(lt)) continue;
        const nums = [...lt.matchAll(numPat)].map(m => parseArNum(m[0])).filter(n => n > 0);
        if (nums.length < 2) continue;
        // Columnas: Tipo Vencimiento Concertación Plazo Tasa Total %
        // nums[0] = Tasa (TNA), nums[1] = Total (valor en moneda de la sección)
        const total = nums[1];
        if (total <= 0) continue;
        const base = 'APERTURA' + sufijo;
        const cnt = caucionCount[base] = (caucionCount[base] || 0) + 1;
        let ticker = cnt === 1 ? base : `${base}_${cnt}`;
        while (usedTickers.has(ticker)) ticker = `${base}_${usedTickers.size + 1}`;
        usedTickers.add(ticker);
        res.holdings.push({ ticker, cierre: total, cantidad: 1 });
        console.log('[PDF] Caución:', ticker, '| total:', total, '| tasa:', nums[0], '%');
      }
    }
  }

  console.log('[PDF] Total:', res.holdings.length, 'instrumentos');
  return res;
}

}

async function confirmarCargaPDF() {
  const data   = _pdfPending;
  const fundId = state.fundId;
  if (!data || !fundId) return;

  showModal(`<div class="modal-box" style="max-width:340px;padding:40px;text-align:center">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <div style="color:#9A9AA0;font-size:14px;font-weight:600">Guardando holdings…</div>
  </div>`);

  try {
    // 1. Borrar holdings anteriores de este fondo
    const del = await fetch(`${SB_URL}/holdings?fund_id=eq.${fundId}`, { method: 'DELETE', headers: SB_HDR });
    if (!del.ok && del.status !== 404) throw new Error('Error borrando holdings: ' + del.status);

    // 2. Insertar nuevos
    const newRows = data.holdings.map(h => ({ fund_id: fundId, ticker: h.ticker, cantidad: h.cantidad, cierre: h.cierre,
                                              vencimiento: h.vencimiento || null, costo: h.costo ?? null }));
    const postHold = rows => fetch(`${SB_URL}/holdings`, {
      method: 'POST',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(rows),
    });
    let ins = await postHold(newRows);
    if (ins.status === 400) {   // todavía no existen las columnas vencimiento/costo
      ins = await postHold(newRows.map(({ vencimiento, costo, ...r }) => r));
    }
    if (!ins.ok) throw new Error('Error insertando holdings: ' + ins.status);

    // 3. Actualizar funds (nav, cuotapartes, fecha, ajustes)
    const patch = {};
    if (data.navCierre)                          patch.nav_cierre  = data.navCierre;
    if (data.cuotapartes)                        patch.cuotapartes = data.cuotapartes;
    if (data.fecha)                              patch.pdf_date    = data.fecha;
    if (data.ajustes && data.ajustes.length > 0) patch.ajustes     = data.ajustes;
    if (Object.keys(patch).length) {
      await fetch(`${SB_URL}/funds?id=eq.${fundId}`, {
        method: 'PATCH',
        headers: { ...SB_HDR, 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      if (FUNDS_CONFIG[fundId]) Object.assign(FUNDS_CONFIG[fundId], {
        navCierre:   data.navCierre   ?? FUNDS_CONFIG[fundId].navCierre,
        cuotapartes: data.cuotapartes ?? FUNDS_CONFIG[fundId].cuotapartes,
        pdfDate:     data.fecha       ?? FUNDS_CONFIG[fundId].pdfDate,
      });
    }

    // 3a. Guardar la foto de la cartera del cierre (para la atribución)
    try { await guardarCierre(fundId, data); }
    catch (e) { console.warn('[iEB] No se pudo guardar el cierre:', e.message); }

    // 3b. Guardar VCP del cierre en el historial (si falla, no frena la carga)
    try {
      const vh = data._vcpHist || prepararVcpHistorial(fundId, data);
      if (vh.escalaOk) await guardarVcpHistorial(fundId, vh);
    } catch (e) { console.warn('[iEB] No se pudo guardar el historial:', e.message); }

    // 4. Actualizar ajustes en memoria (también persistido en Supabase arriba)
    if (data.ajustes && data.ajustes.length > 0) AJUSTES[fundId] = data.ajustes;

    // 5. Actualizar state.holdings
    state.holdings[fundId] = data.holdings.map(h => ({ ticker: h.ticker, cantidad: h.cantidad, cierre: h.cierre,
                                                       vencimiento: h.vencimiento || null, costo: h.costo ?? null }));

    // 6. Detectar tickers nuevos (no en activos_{fundId})
    const tabla = ACTIVOS_TABLE[fundId];
    let existing = new Set();
    try {
      const ac = await sbGet(`/${tabla}?select=ticker`);
      existing = new Set(ac.map(a => a.ticker));
    } catch(e) { /* vacía */ }

    const nuevos = data.holdings.filter(h => !existing.has(h.ticker));
    if (nuevos.length > 0) {
      showActivosCMS(fundId, nuevos, data.denomMap);
    } else {
      closeModal();
      render();
    }
  } catch(e) {
    console.error('[iEB] confirmarCargaPDF:', e);
    showModal(`<div class="modal-box" style="max-width:400px;padding:32px">
      <div style="color:#D33A3F;font-size:15px;font-weight:700;margin-bottom:8px">Error al guardar</div>
      <div style="color:#9A9AA0;font-size:13px;margin-bottom:20px">${e.message}</div>
      <button class="btn-secondary" onclick="closeModal()">Cerrar</button>
    </div>`);
  }
}

function autoSuggest(ticker, denom) {
  const t = ticker.toUpperCase();
  const d = (denom || '').toUpperCase();
  // Soberanos hard dollar (AL30, AO27, GD, GE…)
  if (/^(AL|AO|GD|GE)\d+/.test(t))
    return { fuente: 'data912_arg_bonds', moneda: 'USD', lamina: 100, tipo: 'Soberano HD' };
  // Soberanos dólar linked (con D al final)
  if (/^(T\w+D|AL\w+D|AO\w+D)$/.test(t) && t.endsWith('D'))
    return { fuente: 'data912_arg_bonds', moneda: 'USD', lamina: 1, tipo: 'Soberano DL' };
  // Soberanos ARS (letras, boncaps, boncer)
  if (/^(M\d|T\d|TX|S\d|X\d|TTJ|TTS|TMG|TZX|TZV)/.test(t) && !t.endsWith('D'))
    return { fuente: 'data912_arg_notes', moneda: 'ARS', lamina: 1, tipo: 'Soberanos ARS' };
  // Money Market USD
  if (/^(BALANDP|BAVSAP|BALAN|BAVSA|ADCAP|ALLARIA|ARGENFUNDS|IAM|BAVSA|TT)/.test(t) || d.includes('MONEY MARKET') || d.includes('LIQUIDEZ DOLAR'))
    return { fuente: 'calculo MM usd', moneda: 'USD', lamina: 1, tipo: 'Money Market USD' };
  // Money Market ARS
  if (d.includes('LIQUIDEZ PESOS') || d.includes('MONEY MARKET ARS') || d.includes('AHORRO PESOS'))
    return { fuente: 'calculo MM ars', moneda: 'ARS', lamina: 1, tipo: 'Money Market ARS' };
  // Pagares USD (UMV / cheques dólar)
  if (/^(UMV|#UMV|PAGARE)/.test(t) || d.includes('UMV') || d.includes('PAGARÉ'))
    return { fuente: 'calculo devengamiento', moneda: 'USD', lamina: 1, tipo: 'Pagare USD' };
  // Pagares ARS (cheques pesos)
  if (/^#?MAV/.test(t))
    return { fuente: 'calculo devengamiento', moneda: 'ARS', lamina: 1, tipo: 'Pagare ARS' };
  // ONs hard dollar / dólar cable
  if (d.includes('ON ') || d.includes('OBLIGACI') || /^(YPF|BPCSD|GYC|HVS|JNC|MIC|MSSE|TLC|YM|TSC|CS5)/.test(t))
    return { fuente: 'data912_arg_corp', moneda: 'USD', lamina: 100, tipo: 'ON HD' };
  // Equity USA
  if (d.includes(' US') || /^(AEHR|ANET|APLD|BN|COHR|CRNT|EMR|ETN|LITE|MOD|MPC|NEE|NTR|NU|PLD|RBBN|ROK|TSSI|VLO|VRT|CORN|REET|SDSD|SIL|TBT|URA|WEAT|LOMA|TGS)$/.test(t))
    return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Equity USA' };
  // CEDEARs / ADRs → Equity USA (listed on US)
  if (d.includes('CEDEAR') || d.includes('ADR') || /^(CLSD|COPXD|EWZD|GLDD|NUD|PSXD|VISTD|VSTD)$/.test(t))
    return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Equity USA' };
  // Equity Argentina
  if (d.includes('ARGENTINA') || /^(A3D|ALUAD|BBARD|CEPUD|ECOGD|IEBD|PAMPD|TGSUD|GGAL|YPFD)/.test(t))
    return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Equity Argentina' };
  // Commodities ETF
  if (/^(CORN|WEAT|SIL|URA|GLD|PDBC)/.test(t))
    return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Commodities' };
  // Options (covered call / compra call / venta call)
  if (/^.*P\d+[A-Z]\d+$/.test(t) || d.includes('OPCION') || d.includes('OPTION'))
    return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Covered Call' };
  // Cauciones / Aperturas
  if (/^APERTURA(_ARS)?(_\d+)?$/.test(t) || t === 'CAUCION' || t === 'PASE') {
    if (t.includes('_ARS'))
      return { fuente: 'devengamiento ARS', moneda: 'ARS', lamina: 1, tipo: 'Caución ARS' };
    return { fuente: 'calculo MM usd', moneda: 'USD', lamina: 1, tipo: 'Caución USD' };
  }
  return { fuente: 'hold', moneda: 'USD', lamina: 1, tipo: 'Equity USA' };
}

function showActivosCMS(fundId, nuevos, denomMap) {

  const TIPO_LISTA = [
    'Caución ARS','Caución USD',
    'Commodities','Compra Call','Covered Call','Equity Argentina','Equity USA',
    'Futuro de Dólar',
    'Money Market ARS','Money Market USD','ON DL','ON HD',
    'Pagare ARS','Pagare USD','Short Equity','Short Renta Fija',
    'Soberano DL','Soberano HD','Soberanos ARS','Venta Call','Compra Put','Venta Put',
  ];
  const CATEGORIA_LISTA = [
    'Commodities','Compra Call','Covered Call','Equity','Futuro de Dólar','Liquidez',
    'Renta Fija','Short Equity','Short Renta Fija','Venta Call','Compra Put','Venta Put',
  ];
  const isUsdFund = FUNDS_CONFIG[fundId]?.moneda === 'USD';
  const FUENTES_EXCLUIR_USD = ['calculo devengamiento', 'devengamiento ARS'];
  const FUENTE_LISTA = Object.keys(FUENTE_KIND)
    .filter(f => !isUsdFund || !FUENTES_EXCLUIR_USD.includes(f));

  const tableRows = nuevos.map((h, i) => {
    const denom    = denomMap[h.ticker] || h.ticker;
    const s        = autoSuggest(h.ticker, denom);
    const tipoOpts = TIPO_LISTA.map(t => `<option value="${t}" ${t===s.tipo?'selected':''}>${t}</option>`).join('');
    const catOpts  = CATEGORIA_LISTA.map(c => `<option value="${c}">${c}</option>`).join('');
    const fOpts    = FUENTE_LISTA.map(f => `<option value="${f}" ${f===s.fuente?'selected':''}>${f}</option>`).join('');
    return `
      <tr style="border-bottom:1px solid rgba(255,255,255,0.04)">
        <td style="padding:8px 6px;white-space:nowrap">
          <span class="ticker-chip" style="font-size:11px">${h.ticker}</span>
          <div style="font-size:10px;color:#5A5A60;margin-top:3px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${denom.substring(0,28)}</div>
        </td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-nom-${i}" value="${denom.substring(0,40)}" placeholder="Nombre" style="min-width:130px"></td>
        <td style="padding:8px 4px"><select class="cms-select" id="c-tip-${i}" style="min-width:120px">${tipoOpts}</select></td>
        <td style="padding:8px 4px"><select class="cms-select" id="c-cat-${i}" style="min-width:120px">${catOpts}</select></td>
        <td style="padding:8px 4px">
          <select class="cms-select" id="c-mon-${i}" style="min-width:64px">
            <option value="ARS" ${s.moneda==='ARS'?'selected':''}>ARS</option>
            <option value="USD" ${s.moneda==='USD'?'selected':''}>USD</option>
          </select>
        </td>
        <td style="padding:8px 4px"><select class="cms-select" id="c-fue-${i}" style="min-width:165px">${fOpts}</select></td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-sym-${i}" value="${h.ticker}" placeholder="Symbol" style="width:88px;font-family:'JetBrains Mono',monospace;font-size:11px"></td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-tas-${i}" value="" placeholder="TNA%" style="width:66px;font-family:'JetBrains Mono',monospace;font-size:11px"></td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-lam-${i}" value="${s.lamina}" placeholder="Lámina" style="width:70px;font-family:'JetBrains Mono',monospace;font-size:11px"></td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-bas-${i}" value="" placeholder="Base" style="width:90px;font-family:'JetBrains Mono',monospace;font-size:11px"></td>
        <td style="padding:8px 4px"><input class="cms-input" id="c-pi-${i}" value="" placeholder="0.00" style="width:72px;font-family:'JetBrains Mono',monospace;font-size:11px"></td>
      </tr>\``;
  }).join('');

  // ── Auto-detectar Covered Calls ────────────────────────────────
  const existingCC = (state.coveredCalls[fundId] || []);
  const existingCCKeys = new Set(existingCC.map(cc => cc.ticker_stock + '|' + cc.ticker_call));
  const ccSugeridos = [];
  for (const h of nuevos) {
    const m = h.ticker.match(/^([A-Z]{3,6})(C|P)\d/);
    if (!m) continue;
    const underlying = m[1];
    const stock = nuevos.find(s =>
      s.ticker !== h.ticker &&
      (s.ticker.toUpperCase().startsWith(underlying) ||
       (s.ticker.length === underlying.length && s.ticker.toUpperCase().split('').sort().join('') === underlying.split('').sort().join(''))) &&
      !s.ticker.match(/[CP]\d{2}/) &&
      s.cantidad >= h.cantidad - 1   // call qty ≤ stock qty (cobertura parcial OK)
    );
    if (stock && !existingCCKeys.has(stock.ticker + '|' + h.ticker)) {
      const parcial = Math.abs(stock.cantidad - h.cantidad) > 1;
      const label   = parcial
        ? `${underlying} CC (${h.cantidad.toLocaleString('es-AR')} / ${stock.cantidad.toLocaleString('es-AR')} cubiertos)`
        : underlying + ' CC';
      ccSugeridos.push({ stock: stock.ticker, call: h.ticker, nombre: underlying + ' CC', label });
    }
  }
  const ccBanner = ccSugeridos.length > 0 ? `
    <div style="margin-bottom:14px;padding:12px 16px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:8px">
      <div style="font-size:11px;font-weight:700;color:#818CF8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Covered Call detectado</div>

          <span class="ticker-chip" style="font-size:11px">${p.call}</span>
          <span style="flex:1;font-size:11px;color:#9A9AA0">${p.label || 'misma cantidad'}</span>
          <button onclick="guardarCoveredCall('${fundId}','${p.stock}','${p.call}','${p.nombre}')"
            style="padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.4);color:#818CF8">
            Vincular →
          </button>
        </div>`).join('')}
    </div>` : '';

  showModal(`
    <div class="modal-box modal-wide">
      <div class="modal-header">
        <div>
          <div style="font-size:11px;color:#A6E635;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">Nuevos activos detectados</div>
          <div style="font-size:18px;font-weight:800">${nuevos.length} instrumento${nuevos.length>1?'s':''} sin registrar</div>
        </div>
        <button onclick="saltarCMS()" style="background:none;border:none;color:#9A9AA0;cursor:pointer;font-size:13px;font-weight:600">Saltar →</button>
      </div>
      <div class="modal-body">
        ${ccBanner}
        <p style="color:#9A9AA0;font-size:13px;margin-bottom:16px">Completá los datos para calcular precios. Los campos <span style="color:#A6E635">fuente precio</span> y <span style="color:#A6E635">lámina</span> son los más importantes.</p>
        <div style="overflow-x:auto">
          <table class="cms-table">
            <thead>
              <tr>
                <th>Ticker</th><th>Nombre</th><th>Tipo</th><th>Categoría</th><th>Moneda</th>
                <th>Fuente precio ★</th><th>Live symbol</th><th>TNA %</th><th>Lámina ★</th><th>Base</th><th>P. inicial</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="saltarCMS()">Saltar</button>
        <button class="btn-primary" onclick="guardarNuevosActivos()">💾 Guardar activos</button>
      </div>
    </div>`);
}

async function guardarNuevosActivos() {
  if (!_cmsData) return;
  const { fundId, nuevos } = _cmsData;
  const tabla = ACTIVOS_TABLE[fundId];

  const rows = nuevos.map((h, i) => ({
    ticker:        h.ticker,
    nombre:        document.getElementById(`c-nom-${i}`)?.value?.trim() || h.ticker,
    tipo_activo:   document.getElementById(`c-tip-${i}`)?.value || 'Equity USA',
    categoria:     document.getElementById(`c-cat-${i}`)?.value || null,
    moneda:        document.getElementById(`c-mon-${i}`)?.value || 'ARS',
    fuente_precio: document.getElementById(`c-fue-${i}`)?.value || 'hold',
    live_symbol:   document.getElementById(`c-sym-${i}`)?.value?.trim() || h.ticker,
    tasa:          parseFloat(document.getElementById(`c-tas-${i}`)?.value) || null,
    lamina:        parseFloat(document.getElementById(`c-lam-${i}`)?.value) || 1,
    base:          document.getElementById(`c-bas-${i}`)?.value?.trim() || null,
    precio_inicial: parseFloat(document.getElementById(`c-pi-${i}`)?.value) || null,
  }));

  showModal(`<div class="modal-box" style="max-width:340px;padding:40px;text-align:center">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <div style="color:#9A9AA0;font-size:14px;font-weight:600">Guardando activos…</div>
  </div>`);

  try {
    const resp = await fetch(`${SB_URL}/${tabla}`, {
      method: 'POST',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal,resolution=ignore-duplicates' },
      body: JSON.stringify(rows),
    });
    if (!resp.ok) throw new Error('Error insertando activos: ' + resp.status + ' ' + await resp.text());

    // Actualizar meta en memoria
    if (!state.meta[fundId]) state.meta[fundId] = {};
    for (const r of rows) {
      const kind = FUENTE_KIND[r.fuente_precio] || 'hold';
      state.meta[fundId][r.ticker] = {
        denom: r.nombre, tipo: r.tipo_activo, moneda: r.moneda,
        fuente: r.fuente_precio, kind,
        liveSymbol: r.live_symbol || r.ticker,
        tasa: r.tasa, lamina: r.lamina || 1,
      };
    }
    closeModal();
    render();
  } catch(e) {
    console.error('[iEB] guardarNuevosActivos:', e);
    showModal(`<div class="modal-box" style="max-width:400px;padding:32px">
      <div style="color:#D33A3F;font-size:15px;font-weight:700;margin-bottom:8px">Error al guardar</div>
      <div style="color:#9A9AA0;font-size:13px;margin-bottom:20px">${e.message}</div>
      <button class="btn-secondary" onclick="closeModal()">Cerrar</button>
    </div>`);
  }
}

function confirmarEliminarActivo(fundId, ticker) {
  const holdings = state.holdings[fundId] || [];
  const enCartera = holdings.some(h => h.ticker === ticker);
  if (enCartera) {
    const ok = confirm(
      `⚠️ "${ticker}" todavía está en la cartera actual.\n\n` +
      `Eliminarlo del maestro de activos no lo quitará de los holdings, ` +
      `pero perderás su configuración (tipo, fuente de precio, etc.).\n\n` +
      `¿Querés eliminarlo igual?`
    );
    if (!ok) return;
  } else {
    const ok = confirm(`¿Eliminar "${ticker}" del maestro de activos?`);
    if (!ok) return;
  }
  eliminarActivo(fundId, ticker);
}

async function eliminarActivo(fundId, ticker) {
  const tabla = ACTIVOS_TABLE[fundId];
  try {
    const r = await fetch(`${SB_URL}/${tabla}?ticker=eq.${encodeURIComponent(ticker)}`, {
      method: 'DELETE', headers: SB_HDR,
    });
    if (!r.ok) throw new Error(await r.text());
    // Quitar de state.meta
    if (state.meta[fundId]) delete state.meta[fundId][ticker];
    cargarActivosTabla(fundId);
  } catch(e) {
    alert('Error al eliminar: ' + e.message);
  }
}

    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Ticker</th><th>Nombre</th><th>Tipo</th><th>Categoría</th>
            <th>Moneda</th><th>Fuente precio</th><th>Lámina</th><th>Base</th><th></th>
          </tr>

    wrap.innerHTML = `<div class="center-msg" style="min-height:80px"><span style="color:#D33A3F">Error cargando activos: ${e.message}</span></div>`;
  }
}

async function guardarNuevoActivo(fundId) {
  const ticker = document.getElementById('cr-ticker')?.value?.trim().toUpperCase();
  if (!ticker) { alert('El ticker es obligatorio.'); return; }
  const tabla = ACTIVOS_TABLE[fundId];
  const row = {
    ticker,
    nombre:        document.getElementById('cr-nom')?.value || ticker,
    tipo_activo:   document.getElementById('cr-tip')?.value || 'Otros',
    categoria:     document.getElementById('cr-cat')?.value || null,
    moneda:        document.getElementById('cr-mon')?.value || 'ARS',
    fuente_precio: document.getElementById('cr-fue')?.value || 'hold',
    live_symbol:   document.getElementById('cr-sym')?.value || null,
    tasa:          parseFloat(document.getElementById('cr-tas')?.value) || null,
    lamina:        parseFloat(document.getElementById('cr-lam')?.value) || 1,
    base:          parseFloat(document.getElementById('cr-bas')?.value) || null,
    precio_inicial:parseFloat(document.getElementById('cr-pi')?.value)  || null,
  };
  try {
    const r = await fetch(`${SB_URL}/${tabla}`, {
      method: 'POST',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(row),
    });
    if (!r.ok) throw new Error(await r.text());
    // Actualizar state.meta
    const fuente = row.fuente_precio;
    const kind   = FUENTE_KIND[fuente] || 'hold';
    if (!state.meta[fundId]) state.meta[fundId] = {};
    state.meta[fundId][ticker] = {
      denom: row.nombre, tipo: row.tipo_activo, categoria: row.categoria || '',
      moneda: row.moneda, fuente, kind,
      liveSymbol: row.live_symbol, tasa: row.tasa,
      lamina: row.lamina, base: row.base, precioInicial: row.precio_inicial,
    };
    closeModal();
    cargarActivosTabla(fundId);
  } catch(e) {
    alert('Error al guardar: ' + e.message);
  }
}

async function guardarEditarActivo(fundId, ticker) {
  const tabla = ACTIVOS_TABLE[fundId];
  const updates = {
    nombre:        document.getElementById('ed-nom')?.value?.trim(),
    tipo_activo:   document.getElementById('ed-tip')?.value,
    categoria:     document.getElementById('ed-cat')?.value || null,
    moneda:        document.getElementById('ed-mon')?.value,
    fuente_precio: document.getElementById('ed-fue')?.value,
    live_symbol:   document.getElementById('ed-sym')?.value?.trim(),
    tasa:          parseFloat(document.getElementById('ed-tas')?.value) || null,
    lamina:        parseFloat(document.getElementById('ed-lam')?.value) || 1,
    base:           document.getElementById('ed-bas')?.value?.trim() || null,
    precio_inicial: parseFloat(document.getElementById('ed-pi')?.value) || null,
  };
  try {
    const r = await fetch(`${SB_URL}/${tabla}?ticker=eq.${encodeURIComponent(ticker)}`, {
      method: 'PATCH',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(updates),
    });
    if (!r.ok) throw new Error(await r.text());
    closeModal();
    cargarActivosTabla(fundId);
  } catch(e) {
    alert('Error guardando: ' + e.message);
  }
}
