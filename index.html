  .logo {

  .live-dot {

  @keyframes pulse {

  .cms-input {

  /* Upload button */
  .upload-btn {

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN — editar aquí cuando cambia el PDF
// Los datos de fondos (moneda, color, cuotapartes) vienen de Supabase.
// Solo los ajustes contables quedan acá porque cambian con cada PDF.
// ═══════════════════════════════════════════════════════════════════

const SB_URL = 'https://xyoxonwufbrorwsoyyce.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5b3hvbnd1ZmJyb3J3c295eWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjA4OTUsImV4cCI6MjA5NzI5Njg5NX0.b7uBEOnBMK9VjD_AuRaiNSv1IOh2_gVO72ybk9OL5KM';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

// Nombre de la tabla de activos para cada fondo
const ACTIVOS_TABLE = {
  REIT:       'activos_reit',
  PNIZF:      'activos_pnizf',
  CICLO_NOVA: 'activos_ciclo_nova',
};

// Ajustes contables por fondo (cambian con cada PDF — editar acá)
const AJUSTES = {
  REIT: [
    { label: '(+) Disponibilidades',              val:  11745979.95 },
    { label: '(+) Gastos diferidos (honorarios)', val: 802559737.10 },
    { label: '(−) Provisiones',                   val: -346226999.68 },
    { label: '(−) Acreedores por operaciones',    val:  -1145256.81 },
  ],
  PNIZF: [
    { label: '(+) Disponibilidades',             val:  34529010.16 },
    { label: '(+) Otros créditos no corrientes', val: 185839020.46 },
    { label: '(+) Bienes de cambio',             val: 29256797700.48 },
    { label: '(+) Cuenta overnight',             val:    834455.56 },
    { label: '(+) Rentas a cobrar',              val:   1144084.44 },
    { label: '(−) Provisiones',                  val:    -60531.24 },
    { label: '(−) Acreedores por operaciones',   val: -12074511.17 },
    { label: '(−) Honorarios a pagar',           val:     -7281.68 },
  ],
  CICLO_NOVA: [],
};

// FUNDS_CONFIG se construye en init() a partir de la tabla `funds` de Supabase.
// Acá solo guardamos lo que no viene de ahí (los ajustes).
let FUNDS_CONFIG = {};

// ═══════════════════════════════════════════════════════════════════
// LÓGICA DE PRECIOS — basada en fuente_precio + moneda del fondo
// ═══════════════════════════════════════════════════════════════════

// Mapeo fuente_id → kind interno
const FUENTE_KIND = {
  'data912_arg_bonds':     'market',
  'data912_arg_corp':      'market',
  'data912_arg_notes':     'market',
  'data912_arg_stocks':    'market',
  'data912_arg_cedears':   'market',
  'data912_arg_options':   'market',
  'data912_us_stocks':     'usMarket',
  'data912_us_adrs':       'usMarket',
  'calculo MM usd':        'mmUsd',
  'calculo devengamiento': 'devengo',
  'calculo MM ars':        'mmArs',
  'devengamiento ARS':     'devengoARS',
  'globo':                 'hold',
  'hold':                  'hold',
  'yahoo':                 'yahoo',
};

// Días hábiles hasta liquidación (para devengamiento)
function nextBizDays() {
  const ar = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
  const hour = ar.getHours();
  let d = new Date(ar);
  if (hour >= 18) d.setDate(d.getDate() + 1);
  const dow = d.getDay();
  if (dow === 6) return 3;
  if (dow === 0) return 2;
  return 1;
}

// ── calcPrecio ───────────────────────────────────────────────────────
// Devuelve { price, live } donde `price` está expresado en la moneda
// del fondo (ARS para fondos ARS, USD para fondos USD).
//
// fondoMoneda: 'ARS' | 'USD'
// fxLive:  MEP hoy   (data912)
// fxAyer:  MEP ayer  (fx_history)
//
// Fondos ARS — los instrumentos USD se convierten a ARS vía MEP:
//   market ARS  → precio data912 (ya en ARS)
//   mmUsd       → cierre × MEP_hoy / MEP_ayer
//   devengo     → cierre × (1+TNA/365×n) × MEP_hoy / MEP_ayer
//   devengoARS  → cierre × (1+TNA/365×n)   (ya es ARS puro)
//
// Fondos USD — los instrumentos ARS se convierten a USD vía MEP:
//   market ARS  → precio data912 / MEP_hoy
//   usMarket    → precio USA × canje  (canje = CCL/MEP para pasar cable→MEP)
//   mmUsd       → cierre  (ya está en USD, no cambia)
//   devengo     → cierre × (1+TNA/365×n)  (devenga en USD)
//   devengoARS  → cierre × (1+TNA/365×n) / MEP_hoy  (ARS→USD)
//
function calcPrecio(h, meta, fondoMoneda, fxLive, fxAyer, marketMap, usMap, canje, yahooMap) {
  const kind   = meta?.kind   || 'hold';
  const tipo   = meta?.tipo   || '';
  const tasa   = meta?.tasa   ?? null;
  const lamina = meta?.lamina || 1;
  const sym    = meta?.liveSymbol || h.ticker;
  const fxNow  = fxLive || fxAyer || 0;
  const fxB    = fxAyer || fxNow;
  const n      = nextBizDays();
  const base   = h.cierre * lamina;

  // ── MERCADO LOCAL (bonos AR, letras, CEDEARs, acciones AR, opciones) ─
  if (kind === 'market') {
    const raw  = marketMap?.[sym];
    let liveP  = null;
    if (raw && raw.c > 0) {
      if (fondoMoneda === 'USD') {
        // En fondo USD el cierre del PDF está en USD pero data912 devuelve ARS.
        // No comparar escalas — usar data912 directo (se divide por MEP más abajo).
        liveP = raw.c;
      } else if (base > 0) {
        // Fondo ARS: ambos en ARS, validar escala con candidatos ×1 / ÷100 / ×100
        const cands = [raw.c, raw.c / 100, raw.c * 100];
        const best  = cands.reduce((a, b) =>
          Math.abs(Math.log(b / base)) < Math.abs(Math.log(a / base)) ? b : a
        );
        liveP = Math.abs(best / base - 1) <= 0.40 ? best : null;
      }
    }
    const priceARS = liveP ?? base;
    const live     = liveP != null;
    if (fondoMoneda === 'USD') {
      // HD: data912 devuelve precio directo en USD (hard dollar)
      if (tipo.includes('HD'))
        return { price: priceARS, live };
      // Sin precio live: cierre del PDF ya está en USD → usar base directamente (no dividir por MEP)
      if (!live) return { price: base, live: false };
      // Con precio live (data912 en ARS): convertir a USD vía MEP
      return { price: fxNow > 0 ? priceARS / fxNow : base, live: fxNow > 0 };
    }
    return { price: priceARS, live };
  }

  // ── ACCIONES / ADRs USA (precio en USD cable) ────────────────────
  if (kind === 'usMarket') {
    const raw = usMap?.[sym];
    if (raw && raw.c > 0 && raw.v > 0) {
      const priceUSD = raw.c;
      if (fondoMoneda === 'USD')
        // Precio USD cable → USD MEP dividiendo por canje (CCL/MEP)
        return { price: canje > 0 ? priceUSD * canje : priceUSD, live: canje > 0 };
      // Fondo ARS: USD cable → ARS vía CCL
      return { price: priceUSD * fxNow * canje, live: fxNow > 0 };
    }
    return { price: base, live: false };
  }

  // ── MONEY MARKET USD / Pagaré USD (devenga en USD) ───────────────
  if (kind === 'mmUsd') {
    if (tasa == null) return { price: base, live: false };
    const devengado = base * (1 + tasa / 100 / 365 * n);
    if (fondoMoneda === 'USD')
      return { price: devengado, live: true };
    // Fondo ARS: ajustar por variación de MEP
    if (fxB > 0)
      return { price: devengado * (fxNow / fxB), live: fxNow > 0 };
    return { price: devengado, live: true };
  }

  // ── DEVENGAMIENTO USD (legacy) ────────────────────────────────────
  if (kind === 'devengo') {
    if (tasa == null) return { price: base, live: false };
    const devengado = base * (1 + tasa / 100 / 365 * n);
    if (fondoMoneda === 'USD')
      return { price: devengado, live: true };
    if (fxB > 0)
      return { price: devengado * (fxNow / fxB), live: fxNow > 0 };
    return { price: devengado, live: true };
  }

  // ── MONEY MARKET ARS / Pagaré ARS (devenga en ARS) ──────────────
  if (kind === 'mmArs') {
    if (tasa == null) return { price: base, live: false };
    const devengado = base * (1 + tasa / 100 / 365 * n);
    if (fondoMoneda === 'ARS')
      return { price: devengado, live: true };
    // Fondo USD: base en USD → devengado * MEP_ayer / MEP_hoy
    if (fxNow > 0 && fxB > 0)
      return { price: devengado * fxB / fxNow, live: true };
    if (fxNow > 0)
      return { price: devengado / fxNow, live: true };
    return { price: base, live: false };
  }

  // ── DEVENGAMIENTO ARS puro ───────────────────────────────────────
  if (kind === 'devengoARS') {
    if (tasa == null) return { price: base, live: false };
    const devengado = base * (1 + tasa / 100 / 365 * n);
    if (fondoMoneda === 'ARS')
      return { price: devengado, live: true };
    if (fxNow > 0)
      return { price: devengado / fxNow, live: true };
    return { price: base, live: false };
  }

  // ── YAHOO FINANCE (acciones USA sin precio en data912) ──────────
  if (kind === 'yahoo') {
    const yPrice = yahooMap?.[sym];
    if (yPrice > 0) {
      return { price: canje > 0 ? yPrice * canje : yPrice, live: true };
    }
    return { price: base, live: false };
  }

  // ── HOLD / fallback ──────────────────────────────────────────────
  return { price: base, live: false };
}

// ═══════════════════════════════════════════════════════════════════
// CÁLCULO DE NAV
// ═══════════════════════════════════════════════════════════════════

function calcNAV(fundId) {
  const cfg      = FUNDS_CONFIG[fundId];
  if (!cfg) return { totalInv: 0, ajusteSum: 0, pnBruto: 0, honorario: 0, pn: 0, navLive: 0, rend: 0 };
  const holdings  = state.holdings[fundId] || [];
  const meta      = state.meta[fundId] || {};
  const moneda    = cfg.moneda || 'ARS';
  let totalInv    = 0;
  let totalCierre = 0;   // misma cartera valuada a los precios del PDF

  for (const h of holdings) {
    const m = meta[h.ticker];
    // Los futuros de dólar no suman al PN
    if (m?.tipo === 'Futuro de Dólar') continue;
    const { price } = calcPrecio(h, m, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
    const lamina = m?.lamina || 1;
    const montoH = h.cantidad * (price / lamina);
    const montoC = h.cantidad * h.cierre;
    const isShortCallH = SHORT_OPT_TIPOS.includes(m?.tipo);
    totalInv    += isShortCallH ? -Math.abs(montoH) : montoH;
    totalCierre += isShortCallH ? -Math.abs(montoC) : montoC;
  }

  const ajustes   = AJUSTES[fundId] || [];
  const ajusteSum = ajustes.reduce((s, a) => s + a.val, 0);
  const pnBruto   = totalInv + ajusteSum;
  // PNIZF ya incluye honorarios en los ajustes del PDF → no restar el calculado
  const honorario = fundId === 'PNIZF' ? 0 : pnBruto * (cfg.feeAnual || 0) / 365;
  const pn        = pnBruto - honorario;
  // CICLO_NOVA: el PDF expresa el valor de cuotaparte "en miles" (por 1.000 cuotapartes),
  // y las cuotapartes vienen en unidades → × 1000 para comparar con el NAV del PDF
  // Rendimiento = variación del patrimonio vs. el mismo patrimonio a precios del PDF.
  // Así no arrastra el redondeo del valor publicado (4 decimales) ni depende del
  // formato de las cuotapartes; el NAV en vivo se proyecta desde el NAV oficial.
  const pnCierre  = totalCierre + ajusteSum;
  let rend, navLive;
  if (pnCierre > 0 && cfg.navCierre > 0) {
    rend    = pn / pnCierre - 1;
    navLive = cfg.navCierre * (1 + rend);
  } else {
    navLive = cfg.cuotapartes > 0 ? (pn / cfg.cuotapartes) * (fundId === 'CICLO_NOVA' ? 1000 : 1) : 0;
    rend    = cfg.navCierre > 0 ? navLive / cfg.navCierre - 1 : 0;
  }

  return { totalInv, ajusteSum, pnBruto, honorario, pn, navLive, rend };
}

// Carga los activos de la tabla específica de cada fondo
// Devuelve { [fundId]: { [ticker]: metaEntry } }
async function cargarMeta() {
  const meta = {};
  await Promise.all(
    Object.entries(ACTIVOS_TABLE).map(async ([fundId, tabla]) => {
      try {
        let rows;
        try {
          rows = await sbGet(`/${tabla}?select=ticker,nombre,tipo_activo,categoria,moneda,fuente_precio,live_symbol,tasa,lamina,base,precio_inicial`);
        } catch(e1) {
          // precio_inicial columna aún no existe → reintentar sin ella
          console.warn(`[iEB] precio_inicial no encontrada en ${tabla}, reintentando sin ella`);
          rows = await sbGet(`/${tabla}?select=ticker,nombre,tipo_activo,categoria,moneda,fuente_precio,live_symbol,tasa,lamina,base`);
        }
        const fondoMeta = {};
        for (const r of rows) {
          const fuente = r.fuente_precio || 'hold';
          const kind   = FUENTE_KIND[fuente] || 'hold';
          const entry  = {
            denom:      r.nombre     || r.ticker,
            tipo:       r.tipo_activo || 'Otros',
            categoria:  r.categoria  || '',
            moneda:     r.moneda     || 'ARS',
            fuente,
            kind,
            liveSymbol: r.live_symbol || r.ticker,
            tasa:       r.tasa   != null ? parseFloat(r.tasa)   : null,
            lamina:     r.lamina != null ? parseFloat(r.lamina)
                                        : (fuente.startsWith('data912') ? 100 : 1),
            base:          r.base          != null ? parseFloat(r.base)          : 0,
            precioInicial: r.precio_inicial != null ? parseFloat(r.precio_inicial) : null,
          };
          fondoMeta[r.ticker] = entry;
          if (r.live_symbol && r.live_symbol !== r.ticker) fondoMeta[r.live_symbol] = entry;
        }
        meta[fundId] = fondoMeta;
      } catch (e) {
        console.warn(`[iEB] No se pudo cargar ${tabla}:`, e.message);
        meta[fundId] = {};
      }
    })
  );
  return meta;
}

// '20/10/2026' → '2026-10-20'
function fechaPDFaISO(f) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((f || '').trim());
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
}

// Arma el punto de historial a partir de un PDF ya parseado.
// El VCP del PDF puede venir en otra escala (ej. por 1.000 cuotapartes):
// se normaliza contra el último valor guardado para que la serie sea continua.
function prepararVcpHistorial(fundId, data) {
  const fecha = fechaPDFaISO(data?.fecha);
  const crudo = data?.navCierre;
  const serie = (state.historial[fundId] || []).filter(p => !fecha || p.fecha < fecha);
  const prev  = serie.length ? serie[serie.length - 1] : null;
  let vcp = crudo > 0 ? crudo : null, escalaOk = true;
  if (vcp && prev?.vcp > 0) {
    escalaOk = false;
    for (const k of [1, 1000, 0.001, 100, 0.01]) {
      if (Math.abs((crudo / k) / prev.vcp - 1) < 0.25) { vcp = crudo / k; escalaOk = true; break; }
    }
  }
  const varPrev = vcp && prev?.vcp > 0 ? vcp / prev.vcp - 1 : null;
  return { fecha, vcp, prev, varPrev, escalaOk };
}

async function guardarVcpHistorial(fundId, vh) {
  if (!vh?.fecha || !(vh.vcp > 0)) return false;
  const r = await fetch(`${SB_URL}/vcp_historial?on_conflict=fund_id,fecha,clase`, {
    method: 'POST',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ fund_id: fundId, fecha: vh.fecha, clase: 'A', vcp: vh.vcp, fuente: 'pdf' }),
  });
  if (!r.ok) throw new Error('vcp_historial ' + r.status);
  // Actualizar en memoria (reemplaza si ya existía la fecha)
  const serie = (state.historial[fundId] || []).filter(p => p.fecha !== vh.fecha);
  serie.push({ fecha: vh.fecha, vcp: vh.vcp, pn: null });
  serie.sort((a, b) => a.fecha.localeCompare(b.fecha));
  state.historial[fundId] = serie;
  return true;
}

// ── VENTANA DE ACTUALIZACIÓN: lun–vie 9:00–17:20 (hora Argentina) ──
const HORARIO_DESDE = 9 * 60;        // 09:00
const HORARIO_HASTA = 17 * 60 + 20;  // 17:20

function dentroHorarioMercado() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Argentina/Buenos_Aires',
    hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit',
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t)?.value || '';
  const wd = get('weekday');
  if (wd === 'Sat' || wd === 'Sun') return false;
  const mins = (parseInt(get('hour'), 10) % 24) * 60 + parseInt(get('minute'), 10);
  return mins >= HORARIO_DESDE && mins <= HORARIO_HASTA;
}

async function actualizarPrecios() {
  if (state.updatingPrices) return;
  if (!dentroHorarioMercado()) { render(); return; }
  state.updatingPrices = true;
  render();
  try {
    const live = await fetchLivePrecios();
    state.fxLive          = live.fxLive;
    state.canje           = live.canje;
    state.marketMap       = live.marketMap;
    state.usMap           = live.usMap;
    state.yahooMap        = live.yahooMap || {};
    state.lastPriceUpdate = new Date();
    await fetchPreciosSubyacentes().catch(() => {});
  } finally {
    state.updatingPrices = false;
    render();
  }
}

      fetch('https://data912.com/live/arg_cedears').then(r => r.json()).catch(() => []),
      fetch('https://data912.com/live/arg_options').then(r => r.json()).catch(() => []),
      fetch('https://data912.com/live/arg_stocks').then(r => r.json()).catch(() => []),

    const mepRow = mepMap['AL30'] || mepMap['GD30'] || mepMap['AL30D'];
    // CCL: promedio de acciones líquidas — GGAL, YPFD, LOMA, SUPV
    const CCL_TICKERS = ['GGAL', 'YPFD', 'BMA'];

    // ── YAHOO FINANCE ──────────────────────────────────────────────

        .filter(e => e.kind === 'yahoo' && e.liveSymbol)

        const yUrl = 'https://xyoxonwufbrorwsoyyce.supabase.co/functions/v1/yahoo-prices';
        const yData = await fetch(yUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
          body: JSON.stringify({ symbols: yahooSymbols }),
        }).then(r => r.json()).catch(() => null);

            }
          }
        }
      } catch(e) {
        console.warn('[iEB] Yahoo Finance error:', e);

    return { fxLive, canje, marketMap, usMap, yahooMap };

  const root = document.getElementById('app');
  if (state.loading) {
    root.innerHTML = `<div class="center-msg"><div class="spinner"></div><span>Cargando datos…</span></div>`;
    return;
  }
  if (state.error) {
    root.innerHTML = `<div class="center-msg"><span style="color:#D33A3F">Error: ${state.error}</span></div>`;
    return;
  }
  if (state.view === 'landing') {
    root.innerHTML = renderLanding();
  } else if (state.view === 'atrib') {
    root.innerHTML = renderAtribucion(state.fundId);
  } else if (TOOL_RENDER[state.view]) {
    root.innerHTML = TOOL_RENDER[state.view](state.fundId);
  } else if (state.view === 'activos') {
    root.innerHTML = renderActivosPage(state.fundId);
    bindEvents();
    cargarActivosTabla(state.fundId);
    return;
  } else {
    root.innerHTML = renderFondo(state.fundId);
  }
  bindEvents();
}

// ── MONTOS AJUSTADOS POR NOCIONAL DE OPCIONES VENDIDAS (solo CICLO_NOVA) ──
// Opción vendida (Venta Call, Covered Call, Venta Put):
//   montoTabla   = −|prima|              → lo que vale la posición (resta en el PN)
//   montoDisplay = −|prima| + nocional   → exposición (nocional = cantidad × BASE)
// El nocional total se RESERVA de la liquidez (MM y cauciones USD/ARS, o
// cualquier activo con categoría "Liquidez"), en proporción a su monto, para
// que esa caja no se use para nuevas compras. Si el nocional supera la
// liquidez, la liquidez queda negativa (alerta visible en rojo).
// En un Covered Call armado (acción + call) el nocional de la call también se
// reserva y se suma a la exposición de la fila combinada.
// Compras de opciones (Compra Call / Compra Put) NO llevan ajuste: se valúan
// por la prima, porque el comprador no tiene exposición nocional que respaldar.
const SHORT_OPT_TIPOS = ['Venta Call', 'Covered Call', 'Venta Put'];
const LIQUIDEZ_TIPOS  = ['Money Market USD', 'Money Market ARS', 'Caución USD', 'Caución ARS'];
const esLiquidez = meta => LIQUIDEZ_TIPOS.includes(meta?.tipo) || meta?.categoria === 'Liquidez';

function calcMontosCartera(fundId) {
  const cfg       = FUNDS_CONFIG[fundId];
  const holdings  = state.holdings[fundId] || [];
  const fondoMeta = state.meta[fundId]    || {};
  const moneda    = cfg?.moneda || 'ARS';
  const applyAdj  = fundId === 'CICLO_NOVA';

  const items = holdings.map(h => {
    const meta   = fondoMeta[h.ticker];
    const { price } = calcPrecio(h, meta, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
    const lamina  = meta?.lamina || 1;
    const monto   = h.cantidad * (price / lamina);
    const tipo    = meta?.tipo || 'Otros';
    const isOpt   = applyAdj && SHORT_OPT_TIPOS.includes(tipo);
    let notional  = isOpt ? Math.abs(h.cantidad) * (meta?.base || 0) : 0;
    // El nocional (cantidad × BASE) está en la moneda del instrumento.
    // Convertir a la moneda del fondo vía MEP si difieren (ej: call en ARS, fondo USD).
    if (notional !== 0) {
      const instrMoneda = meta?.moneda || 'ARS';
      const fx = state.fxLive || state.fxAyer || 0;
      if (instrMoneda === 'ARS' && moneda === 'USD' && fx > 0) notional = notional / fx;
      else if (instrMoneda === 'USD' && moneda === 'ARS' && fx > 0) notional = notional * fx;
    }
    return { ticker: h.ticker, meta, tipo, monto, notional, isOpt };
  });

  // ── Covered Call merge helper ─────────────────────────────────
  const _ccList    = state.coveredCalls[fundId] || [];
  const _ccByStock = new Map(_ccList.map(cc => [cc.ticker_stock, cc]));
  const _ccCallSet = new Set(_ccList.map(cc => cc.ticker_call));

  function mergeCoveredCalls(resultItems) {
    if (_ccList.length === 0) return resultItems;
    const merged = [];
    for (const item of resultItems) {
      if (_ccCallSet.has(item.ticker)) continue;
      if (_ccByStock.has(item.ticker)) {
        const cc       = _ccByStock.get(item.ticker);
        const callItem = resultItems.find(i => i.ticker === cc.ticker_call);
        if (callItem) {
          const netMonto  = item.monto - Math.abs(callItem.monto);
          const ccNotional = callItem.notional || 0;
          merged.push({ ...item, tipo: 'Covered Call', monto: netMonto,
            montoDisplay: netMonto + ccNotional, montoTabla: netMonto,
            notional: ccNotional, _isCoveredCall: true, _cc: cc });
          continue;
        }
      }
      merged.push(item);
    }
    return merged;
  }

  if (!applyAdj) return mergeCoveredCalls(items.map(i => ({ ...i, montoDisplay: i.monto, montoTabla: i.monto })));

  // Reserva del nocional: proporcional entre los activos de liquidez
  const totalNotional = items.reduce((s, i) => s + i.notional, 0);
  const totalLiq      = items.filter(i => esLiquidez(i.meta)).reduce((s, i) => s + i.monto, 0);

  const base = items.map(i => {
    const isShort    = SHORT_OPT_TIPOS.includes(i.tipo);
    const montoTabla = isShort ? -Math.abs(i.monto) : i.monto;
    let montoDisplay = montoTabla;
    let reservado    = 0;
    if (i.isOpt) {
      montoDisplay = montoTabla + i.notional;
    } else if (esLiquidez(i.meta) && totalLiq > 0) {
      reservado    = totalNotional * (i.monto / totalLiq);
      montoDisplay = i.monto - reservado;   // sin piso: negativo = nocional > liquidez
    }
    return { ...i, montoDisplay, montoTabla, reservado };
  });
  const out = mergeCoveredCalls(base);
  // Si no hay activos de liquidez en cartera, el nocional se descuenta de la
  // liquidez de los ajustes (disponibilidades) en el panel de composición.
  out.notionalSinReserva = totalLiq > 0 ? 0 : totalNotional;
  out.totalNotional      = totalNotional;
  return out;
}

// ── BREAKDOWN ────────────────────────────────────────────────────────
function toggleBreakdown(mode) {
  state.breakdown = state.breakdown === mode ? null : mode;
  render();
}

// Suma de los ajustes "Bienes de cambio" del fondo (inmuebles en PNIZF)
function getBienesDeCambio(fundId) {
  return (AJUSTES[fundId] || [])
    .filter(a => /bienes\s+de\s+cambio/i.test(a.label || ''))
    .reduce((s, a) => s + a.val, 0);
}

function toggleBreakdownBase(b) {
  state.breakdownBase = b;
  render();
}

function renderBreakdownPanel(fundId) {
  const mode = state.breakdown;
  if (!mode) return '';

  const { pn, totalInv } = calcNAV(fundId);
  if (pn <= 0) return '';

  // Base del cálculo: PN total | PN − bienes de cambio | subtotal cartera
  const bienes  = getBienesDeCambio(fundId);
  let baseSel   = state.breakdownBase || 'pn';
  if (baseSel === 'fin' && bienes <= 0) baseSel = 'pn';  // sin bienes de cambio no aplica
  const useFin  = baseSel === 'fin';
  const useSub  = baseSel === 'sub';
  const basePN  = useSub ? totalInv : (useFin ? pn - bienes : pn);
  if (basePN <= 0) return '';

  const rawItems = calcMontosCartera(fundId);
  const items = rawItems.map(i => ({
    tipo:        i.meta?.tipo      || 'Otros',
    cat:         i.meta?.categoria || 'Sin categoría',
    monedaInstr: i.meta?.moneda    || 'ARS',
    monto:       i.montoDisplay,
  }));

  // Liquidez = base - subtotal cartera (ajustes + honorarios netos).
  // En modo "activos financieros" excluye los bienes de cambio → liquidez financiera real.
  // En modo "subtotal cartera" da 0 → el panel muestra solo las tenencias.
  const liquidez     = basePN - totalInv - (rawItems.notionalSinReserva || 0);
  const fondoMoneda  = FUNDS_CONFIG[fundId]?.moneda || 'ARS';

  const groups = {};

  if (mode === 'moneda') {
    for (const it of items) {
      if (it.tipo === 'Futuro de Dólar') {
        groups['ARS'] = (groups['ARS'] || 0) - it.monto;
        groups['USD'] = (groups['USD'] || 0) + it.monto;
      } else {
        groups[it.monedaInstr] = (groups[it.monedaInstr] || 0) + it.monto;
      }
    }
    // Liquidez en moneda del fondo
    if (liquidez !== 0) groups[fondoMoneda] = (groups[fondoMoneda] || 0) + liquidez;

  } else if (mode === 'tipo') {
    for (const it of items) {
      if (it.tipo === 'Futuro de Dólar') continue;
      groups[it.tipo] = (groups[it.tipo] || 0) + it.monto;
    }
    // Tipo: no se agrega liquidez (el usuario no lo pidió)

  } else {
    for (const it of items) {
      if (it.tipo === 'Futuro de Dólar') continue;
      groups[it.cat] = (groups[it.cat] || 0) + it.monto;
    }
    // Liquidez en categoría "Liquidez"
    if (liquidez !== 0) groups['Liquidez'] = (groups['Liquidez'] || 0) + liquidez;
  }

  const sorted  = Object.entries(groups).sort((a, b) => b[1] - a[1]);
  const maxAbs  = Math.max(...sorted.map(([, v]) => Math.abs(v)), 1);
  const COLORS  = ['#A6E635','#7C3AED','#2DD4BF','#F59E0B','#60A5FA','#F472B6','#34D399','#FB923C','#A78BFA','#94A3B8'];

  const rows = sorted.map(([label, val], i) => {
    const pct      = val / basePN * 100;
    const barW     = Math.abs(val) / maxAbs * 100;
    const isNeg    = val < 0;
    const barColor = isNeg ? '#D33A3F' : COLORS[i % COLORS.length];
    return `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="width:140px;font-size:12px;color:#C0C0C8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0">${label}</div>
        <div style="flex:1;background:#1E1E26;border-radius:4px;height:10px;overflow:hidden">
          <div style="width:${barW}%;height:100%;background:${barColor};border-radius:4px;transition:width 0.3s"></div>
        </div>
        <div style="width:52px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:${isNeg ? '#D33A3F' : '#E5E5E7'}">${pct.toFixed(1)}%</div>
      </div>`;
  }).join('');

  // Toggle de base — "Activos financieros" solo si el fondo tiene bienes de cambio
  const BASE_OPTS = [
    ['pn',  'PN total'],
    ...(bienes > 0 ? [['fin', 'Activos financieros']] : []),
    ['sub', 'Subtotal cartera'],
  ];
  const baseToggle = `
    <div style="display:flex;gap:5px;align-items:center">
      ${BASE_OPTS.map(([b, label]) => {
        const active = baseSel === b;
        return `<button onclick="toggleBreakdownBase('${b}')"
          style="padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s;
                 background:${active ? 'rgba(166,230,53,0.15)' : 'rgba(255,255,255,0.05)'};
                 border:1px solid ${active ? 'rgba(166,230,53,0.4)' : 'rgba(255,255,255,0.08)'};
                 color:${active ? '#A6E635' : '#9A9AA0'}">${label}</button>`;
      }).join('')}
    </div>`;

  const baseInfo = useFin
    ? `<span style="font-weight:600;text-transform:none;letter-spacing:0;color:#9A9AA0;margin-left:8px">· base ${fARS(basePN)} (PN − bienes de cambio)</span>`
    : useSub
    ? `<span style="font-weight:600;text-transform:none;letter-spacing:0;color:#9A9AA0;margin-left:8px">· base ${fARS(basePN)} (subtotal cartera)</span>`
    : '';

  return `
    <div style="background:#161618;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <div style="font-size:10px;font-weight:700;color:#5A5A60;text-transform:uppercase;letter-spacing:0.6px">
          ${{ moneda: 'Composición por Moneda', tipo: 'Composición por Tipo de Activo', cat: 'Composición por Categoría' }[mode]}${baseInfo}
        </div>
        ${baseToggle}
      </div>
      ${rows}
    </div>`;
}

// ── HISTORIAL DE VCP ─────────────────────────────────────────────────
const HIST_RANGES = [['1M','1M'],['3M','3M'],['6M','6M'],['YTD','YTD'],['1A','1 año'],['TODO','Todo']];
let _histChart = null; // datos del gráfico visible, para el hover

function fDiaHist(iso, largo) {
  return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + (largo ? iso.slice(0, 4) : iso.slice(2, 4));
}
function isoLocal(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Último punto con fecha <= iso
function puntoAl(serie, iso) {
  let r = null;
  for (const p of serie) { if (p.fecha <= iso) r = p; else break; }
  return r;
}
function setHistRange(r) { state.histRange = r; render(); }

function rendimientosHist(serie) {
  const last = serie[serie.length - 1];
  const d    = new Date(last.fecha + 'T12:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  const vs = base => base && base.vcp > 0 && base !== last ? last.vcp / base.vcp - 1 : null;
  return {
    last,
    dia: vs(serie[serie.length - 2]),
    mtd: vs(puntoAl(serie, isoLocal(new Date(y, m, 0)))),          // cierre del mes anterior
    ytd: vs(puntoAl(serie, `${y - 1}-12-31`)),                       // cierre del año anterior
    a12: vs(puntoAl(serie, isoLocal(new Date(y - 1, m, d.getDate())))),
    ini: vs(serie[0]),
  };
}

function inicioRango(lastIso, r) {
  const d = new Date(lastIso + 'T12:00:00');
  if (r === 'YTD') return `${d.getFullYear() - 1}-12-31`;
  const meses = { '1M': 1, '3M': 3, '6M': 6, '1A': 12 }[r];
  if (!meses) return null;
  return isoLocal(new Date(d.getFullYear(), d.getMonth() - meses, d.getDate()));
}

function renderHistorial(fundId) {
  const serie = state.historial[fundId] || [];
  if (serie.length < 2) return '';
  const cfg   = FUNDS_CONFIG[fundId] || {};
  const color = cfg.color || '#A6E635';
  // Mostrar en la misma escala que el NAV de la cartera (ej. Ciclo Nova "en miles")
  const escala = cfg.navCierre > 0 && serie[serie.length - 1].vcp > 0
    ? Math.pow(10, Math.round(Math.log10(cfg.navCierre / serie[serie.length - 1].vcp))) : 1;
  const R     = rendimientosHist(serie);

  // ── Tiles de rendimiento
  const tile = (label, v) => `
    <div style="min-width:86px">
      <div class="metric-label">${label}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:${v == null ? '#5A5A60' : Math.abs(v) < 5e-5 ? '#9A9AA0' : v > 0 ? '#2E9E2A' : '#D33A3F'}">${v == null ? '—' : fPct(v)}</div>
    </div>`;

  // ── Serie del rango elegido
  const desde = inicioRango(R.last.fecha, state.histRange);
  let pts = serie;
  if (desde) {
    const base = puntoAl(serie, desde);           // incluir el punto base del período
    pts = serie.filter(p => p.fecha > desde);
    if (base) pts = [base, ...pts];
  }
  if (pts.length < 2) pts = serie.slice(-2);
  const rendRango = pts[pts.length - 1].vcp / pts[0].vcp - 1;
  // Benchmark T-Bill 1 año: arranca en el mismo valor que el fondo y devenga la tasa
  // vigente cada día (tasa anual × días / 365), sobre las mismas fechas del gráfico.
  const B = state.bench;
  let bench = null;
  if (B.on && B.data?.length) {
    const tasaAl = f => { let r = null; for (const x of B.data) { if (x.fecha <= f) r = x.tasa; else break; } return r ?? B.data[0].tasa; };
    bench = [pts[0].vcp];
    for (let i = 1; i < pts.length; i++)
      bench.push(bench[i - 1] * (1 + tasaAl(pts[i - 1].fecha) / 100 * diasEntre(pts[i - 1].fecha, pts[i].fecha) / 365));
  }
  const rendBench = bench ? bench[bench.length - 1] / bench[0] - 1 : null;

  // ── Geometría
  const _maxLbl = f4(Math.max(...pts.map(p => p.vcp)) * escala * 1.05).length;
  const W = 1000, H = 240, ml = Math.max(64, _maxLbl * 7.4 + 14), mr = 16, mt = 12, mb = 28;
  const iw = W - ml - mr, ih = H - mt - mb;
  const vals = pts.map(p => p.vcp).concat(bench || []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || hi * 0.005;
  lo -= pad; hi += pad;
  const X = i => ml + (pts.length === 1 ? 0 : i / (pts.length - 1) * iw);
  const Y = v => mt + (1 - (v - lo) / (hi - lo)) * ih;
  _histChart = { fundId, pts, X, Y, W, H, ml, mr, mt, mb, escala, bench };
  const pathBench = bench ? bench.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') : '';

  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.vcp).toFixed(1)).join(' ');
  const area = path + ` L${X(pts.length - 1).toFixed(1)} ${mt + ih} L${ml} ${mt + ih} Z`;

  const yTicks = [0, 1, 2, 3].map(k => lo + (hi - lo) * (k + 0.5) / 4);
  const grid = yTicks.map(v => `
    <line x1="${ml}" x2="${W - mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="${ml - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5A5A60" font-family="JetBrains Mono, monospace">${f4(v * escala)}</text>`).join('');
  const nX = Math.min(6, pts.length);
  const xIdx = [...new Set(Array.from({ length: nX }, (_, k) => Math.round(k * (pts.length - 1) / (nX - 1 || 1))))];
  const xLabels = xIdx.map(i => `
    <text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}" font-size="11" fill="#5A5A60">${fDiaHist(pts[i].fecha)}</text>`).join('');
  const lastI = pts.length - 1;

  const rangeBtns = HIST_RANGES.map(([k, label]) => {
    const active = state.histRange === k;
    return `<button onclick="setHistRange('${k}')"
      style="padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;
             background:${active ? 'rgba(166,230,53,0.15)' : 'rgba(255,255,255,0.05)'};
             border:1px solid ${active ? 'rgba(166,230,53,0.4)' : 'rgba(255,255,255,0.08)'};
             color:${active ? '#A6E635' : '#9A9AA0'}">${label}</button>`;
  }).join('');

  return `
    <div style="background:#161618;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <div style="font-size:10px;font-weight:700;color:#5A5A60;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">Evolución cuotaparte · Clase A</div>
          <div style="display:flex;align-items:baseline;gap:10px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800">${f4(R.last.vcp * escala)}</span>
            <span style="font-size:12px;color:#9A9AA0">cierre ${fDiaHist(R.last.fecha, true)}</span>
          </div>

function histHover(ev) {
  const c = _histChart; if (!c) return;
  const svg = ev.currentTarget.ownerSVGElement;
  const box = svg.getBoundingClientRect();
  const cx  = (ev.touches ? ev.touches[0].clientX : ev.clientX);
  const sx  = (cx - box.left) / box.width * c.W;
  const n   = c.pts.length;
  const i   = Math.max(0, Math.min(n - 1, Math.round((sx - c.ml) / (c.W - c.ml - c.mr) * (n - 1))));
  const p   = c.pts[i], px = c.X(i), py = c.Y(p.vcp);
  document.getElementById('hist-hover').style.display = '';
  const cross = document.getElementById('hist-cross'); cross.setAttribute('x1', px); cross.setAttribute('x2', px);
  const dot = document.getElementById('hist-dot'); dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  const prev = i > 0 ? c.pts[i - 1] : null;
  const vd   = prev ? p.vcp / prev.vcp - 1 : null;
  const vr   = p.vcp / c.pts[0].vcp - 1;
  const tip  = document.getElementById('hist-tip');
  tip.innerHTML = `<div style="color:#9A9AA0;margin-bottom:3px">${fDiaHist(p.fecha, true)}</div>
    <div style="font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;color:#E5E5E7">${f4(p.vcp * c.escala)}</div>
    <div style="color:#9A9AA0;margin-top:2px">Día <span style="font-family:'JetBrains Mono',monospace;color:#E5E5E7">${vd == null ? '—' : fPct(vd)}</span>
      · Período <span style="font-family:'JetBrains Mono',monospace;color:#E5E5E7">${fPct(vr)}</span></div>
    ${c.bench ? `<div style="color:#9A9AA0;margin-top:2px">T-Bill 1 año <span style="font-family:'JetBrains Mono',monospace;color:#60A5FA">${fPct(c.bench[i] / c.bench[0] - 1)}</span>
      · Dif. <span style="font-family:'JetBrains Mono',monospace;color:#E5E5E7">${f2((vr - (c.bench[i] / c.bench[0] - 1)) * 100)} pp</span></div>` : ''}`;
  tip.style.display = '';
  const wrapW = box.width, left = px / c.W * wrapW;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(wrapW - tw, left + 12 > wrapW - tw ? left - tw - 12 : left + 12)) + 'px';
}
async function toggleBench() {
  const B = state.bench;
  if (B.on) { B.on = false; render(); return; }
  B.on = true; B.error = null;
  if (!B.data) {
    B.loading = true; render();
    try {
      const desde = Object.values(state.historial).flat().reduce((m, p) => p.fecha < m ? p.fecha : m, '9999') ;
      const d0 = desde < '9999' ? isoLocal(new Date(new Date(desde + 'T12:00:00').getTime() - 15 * 86400000)) : '2024-01-01';
      const r = await fetch('/api/tbill?desde=' + d0);
      if (!r.ok) throw new Error('HTTP ' + r.status);

}

// ── PANEL DE OPCIONES ────────────────────────────────────────────────
// Réplica del cuadro "CC-Puts" (Hoja3), con estas definiciones:
//   Px compra   PUT: strike − prima  |  CALL: costo acción − prima   (precio efectivo)
//   Px a tomar  mín(strike, mercado)  → valor al vencimiento a precio de hoy
//   Resultado   cantidad × (px a tomar − px compra)
//   Cobertura   (mercado − px compra) / mercado  → cuánto puede caer hasta el breakeven
//   Dist. strike mercado / strike − 1
//   TNA         (strike − px compra) / px compra × 365 / días(operación→vto)
//               PUT = rendimiento de la prima sobre la caja neta comprometida
//               CALL = rendimiento máximo si ejercen
//   TEA         (1 + rend. del período)^(365 / días) − 1
//   Cash        PUT: + cantidad × strike (caja a poner si ejercen)
//               CALL: − cantidad × strike (caja que entra si ejercen)
//   Ejercible   PUT: mercado < strike | CALL: mercado > strike (automático)
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);

function calcOpcion(o) {
  const E = +o.cantidad || 0, K = +o.strike || 0, p = +o.prima || 0;
  const isPut = o.tipo === 'PUT';
  const costo = o.costo_accion != null ? +o.costo_accion : null;
  const F     = isPut ? K - p : (costo != null ? costo - p : null);
  const manual = o.precio_manual != null && +o.precio_manual > 0 ? +o.precio_manual : null;
  const pxO   = manual != null ? { px: manual, src: 'manual' } : (state.optPx[optSymbol(o)] || null);
  const M     = pxO?.px ?? null;
  const I     = M != null ? Math.min(K, M) : null;
  const J     = I != null && F != null ? E * (I - F) : null;
  const cob   = M && F != null ? (M - F) / M : null;
  const dist  = M && K ? M / K - 1 : null;
  const itm   = M != null ? (isPut ? M < K : M > K) : null;
  const hoy   = fechaArgISO();
  const dias  = o.vencimiento ? diasEntre(hoy, o.vencimiento) : null;
  const plazo = o.fecha_operacion && o.vencimiento ? diasEntre(o.fecha_operacion, o.vencimiento) : null;
  const rPer  = F > 0 ? (K - F) / F : null;
  const tna   = plazo > 0 && rPer != null ? rPer * 365 / plazo : null;
  const tea   = plazo > 0 && rPer != null ? Math.pow(1 + rPer, 365 / plazo) - 1 : null;
  const cash  = (isPut ? 1 : -1) * E * K;
  return { E, K, p, F, M, src: pxO?.src, I, J, cob, dist, itm, dias, plazo, tna, tea, cash, isPut, primaTotal: E * p };
}

function renderOpciones(fundId) {
  const todas = state.opciones[fundId] || [];

  // ── Resumen (solo abiertas)
  const sum = f => abiertas.reduce((s, x) => s + (f(x) || 0), 0);
  const primas      = sum(x => x.c.primaTotal);
  const resultado   = sum(x => x.c.J);
  const compPuts    = sum(x => x.c.isPut ? x.c.cash : 0);
  const compPutsItm = sum(x => x.c.isPut && x.c.itm ? x.c.cash : 0);
  const cashCallsItm = sum(x => !x.c.isPut && x.c.itm ? -x.c.cash : 0);
  const liquidez = calcMontosCartera(fundId).filter(i => esLiquidez(i.meta)).reduce((s, i) => s + i.monto, 0);
  const coberturaLiq = compPuts > 0 ? liquidez / compPuts : null;
  const usd = n => (n < 0 ? '−' : '') + 'USD ' + _ar0.format(Math.round(Math.abs(n)));

  const chip = (txt, c) => `<span style="display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;background:${c}22;color:${c};border:1px solid ${c}55;white-space:nowrap">${txt}</span>`;

  const actBtn = col => `background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:${col};padding:3px 7px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;margin-right:2px`;

    else if (!cerrada && c.dias != null && c.dias <= 7) alertas.push(chip('Vence en ' + c.dias + 'd', '#F59E0B'));
    const manualTip = o.precio_manual_at ? 'Precio manual cargado el ' + new Date(o.precio_manual_at).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : 'Precio manual';
    const pxBadge = c.M == null ? '' : c.src === 'manual'

    return `

  const totalCash = sum(x => x.c.cash);
  const abierto    = true;   // vive en su propia pestaña

async function cambiarEstadoOpcion(fundId, id, estado) {
  try {
    const r = await fetch(`${SB_URL}/opciones?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ estado }),
    });
    if (!r.ok) throw new Error('Supabase ' + r.status);
    const o = (state.opciones[fundId] || []).find(x => x.id === id);
    if (o) o.estado = estado;
  } catch (e) { console.warn('[iEB] cambiarEstadoOpcion:', e.message); }
  render();
}

  const sym = optSymbol(o);
  const ids = (state.opciones[fundId] || [])
    .filter(x => optSymbol(x) === sym && (x.estado !== 'CERRADA' || x.id === id))
    .map(x => x.id);

    cantidad: num('cant'), strike: num('strike'), prima: num('prima'),

    fecha_operacion: g('fop') || null, vencimiento: g('vto') || null,

function valuarTenencias(fundId) {

    const lamina = m?.lamina || 1;
    const corto  = SHORT_OPT_TIPOS.includes(m?.tipo);

             tipo: m?.tipo || 'Otros', cat: m?.categoria || 'Sin categoría', moneda: m?.moneda || moneda };

// ═══════════════════════════════════════════════════════════════════
// RENTA FIJA: flujos, TIR y duration
// ═══════════════════════════════════════════════════════════════════
// Métodos por instrumento (tabla renta_fija_params):
//   cero    → un solo pago al vencimiento (valor_final por 1 de nominal; default 1)
//   bullet  → cupón fijo (% anual, n pagos por año) + capital al vencimiento
//   flujos  → lista de pagos cargada a mano (fecha; monto por 1 de nominal)
//   manual  → TIR y duration modificada informadas a mano (duales, CER, TIPS…)
// Automático sin configurar: cheques de pago diferido y T-Bills = cero cupón a 1.
// El precio se lleva a la moneda de los flujos: ARS = × MEP, USD cable = ÷ canje (CCL/MEP).
const RF_TIPOS_RE = /soberano|^on\b|\bon\b|bono|letra|lecap|boncap|pagar|cheque|treasury|t-?bill|dual|\bcer\b/i;
const RF_METODOS = { cero: 'Cero cupón', bullet: 'Cupón fijo (bullet)', flujos: 'Flujos a mano', manual: 'TIR manual' };

function esRentaFija(h, m) {
  const tipo = m?.tipo || '';
  if (/^short/i.test(tipo) || SHORT_OPT_TIPOS.includes(tipo) || esLiquidez(m)) return false;
  return m?.categoria === 'Renta Fija' || RF_TIPOS_RE.test(tipo) || !!h?.vencimiento;
}

function rfAuto(ticker, m) {
  if (/^(UMV|MAV|CPD|ECH)/.test(ticker) || /cheque/i.test(m?.tipo || ''))
    return { metodo: 'cero', moneda_flujos: m?.moneda === 'ARS' ? 'ARS' : 'USD', valor_final: 1, _auto: 'Cheque' };
  if (/^US912797/.test(ticker))
    return { metodo: 'cero', moneda_flujos: 'USD cable', valor_final: 1, _auto: 'T-Bill' };
  return null;
}

function rfParamsDe(fundId, ticker, m) {
  return state.rfParams[fundId]?.[ticker] || rfAuto(ticker, m);
}

function canjeRef() {
  if (state.canje && state.canje !== 1) return state.canje;
  return state.fxAyer > 0 && state.fxAyerCCL > 0 ? state.fxAyerCCL / state.fxAyer : 1;
}
const mepRef = () => state.fxLive || state.fxAyer || 0;

// Factor para pasar un importe de la moneda de los flujos a la moneda del fondo
function factorAFondo(fundId, monedaFlujos) {
  const fondo = FUNDS_CONFIG[fundId]?.moneda || 'ARS';
  const mep = mepRef(), canje = canjeRef();
  if (fondo === 'USD') {
    if (monedaFlujos === 'ARS') return mep > 0 ? 1 / mep : null;
    if (monedaFlujos === 'USD cable') return canje;
    return 1;
  }
  if (monedaFlujos === 'ARS') return 1;
  if (monedaFlujos === 'USD cable') return mep * canje || null;
  return mep || null;
}

function addMeses(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  const dia = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, ult));
  return isoLocal(d);
}

// Flujos futuros por 1 de nominal: [{fecha, monto, tipo:'cupon'|'amort'|'vto'}]
function rfFlujos(p, vtoPDF, hoy) {
  if (!p) return [];
  const vto = p.vencimiento || vtoPDF;
  if (p.metodo === 'cero') return vto && vto > hoy ? [{ fecha: vto, monto: +(p.valor_final ?? 1) || 1, tipo: 'vto' }] : [];
  if (p.metodo === 'bullet') {
    if (!vto || vto <= hoy) return [];
    const f = Math.max(1, +p.frecuencia || 2), c = (+p.cupon || 0) / 100 / f, vf = +(p.valor_final ?? 1) || 1;
    const out = [];
    for (let k = 0, fecha = vto; fecha > hoy && k < 400; k++, fecha = addMeses(vto, -12 / f * k)) {
      out.push({ fecha, monto: c + (k === 0 ? vf : 0), tipo: k === 0 ? 'vto' : 'cupon' });
    }
    return out.reverse();
  }
  if (p.metodo === 'flujos') {
    const fl = (p.flujos || []).filter(x => x.fecha > hoy).sort((a, b) => a.fecha.localeCompare(b.fecha));
    return fl.map((x, i) => ({ fecha: x.fecha, monto: +x.monto, tipo: i === fl.length - 1 ? 'vto' : 'cupon' }));
  }
  return [];
}

// TIR efectiva anual (base 365) y duration por bisección
function rfTir(flujos, precio, hoy) {
  if (!(precio > 0) || !flujos.length) return null;
  const t = flujos.map(x => Math.max(diasEntre(hoy, x.fecha), 0) / 365);
  const pv = y => flujos.reduce((s, x, i) => s + x.monto / Math.pow(1 + y, t[i]), 0);
  let lo = -0.95, hi = 20;
  if ((pv(lo) - precio) * (pv(hi) - precio) > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (pv(mid) > precio) lo = mid; else hi = mid;
  }
  const y = (lo + hi) / 2;
  const mac = flujos.reduce((s, x, i) => s + t[i] * x.monto / Math.pow(1 + y, t[i]), 0) / precio;
  return { tir: y, mac, md: mac / (1 + y) };
}

function calcRentaFija(fundId) {
  const hoy = fechaArgISO();
  const pn  = calcNAV(fundId).pn;
  const fondo = FUNDS_CONFIG[fundId]?.moneda || 'ARS';
  return valuarTenencias(fundId).filter(v => esRentaFija(v.h, v.m)).map(v => {
    const p = rfParamsDe(fundId, v.ticker, v.m);
    const monFl = p?.moneda_flujos || (v.moneda === 'ARS' ? 'ARS' : 'USD');
    const fac = factorAFondo(fundId, monFl);
    const precioFondo = v.h.cantidad ? v.monto / v.h.cantidad : 0;          // por 1 de nominal, moneda del fondo
    const precioFl = fac ? precioFondo / fac : null;                         // por 1 de nominal, moneda de los flujos
    const flujos = rfFlujos(p, v.h.vencimiento, hoy);
    let tir = null, md = null, mac = null;
    if (p?.metodo === 'manual') {
      tir = p.tir_manual != null ? +p.tir_manual / 100 : null;
      md  = p.md_manual  != null ? +p.md_manual : null;
    } else {
      const r = rfTir(flujos, precioFl, hoy);
      if (r) ({ tir, md, mac } = r);
    }
    return {
      ticker: v.ticker, tipo: v.tipo, cat: v.cat, h: v.h, m: v.m, p, monFl,
      monedaTir: monFl === 'ARS' ? 'ARS' : 'USD',
      valor: v.monto, peso: pn > 0 ? v.monto / pn : 0, precioFl, fac, flujos,
      vto: p?.vencimiento || v.h.vencimiento || null, tir, md, mac,
      estado: !p ? 'sin' : (tir == null ? 'error' : (p._auto ? 'auto' : 'ok')),
    };
  });
}

// ── Vista Renta fija ────────────────────────────────────────────────
function renderRentaFija(fundId) {
  const A = state.rfVista || (state.rfVista = { grupo: 'moneda' });
  const filas = calcRentaFija(fundId);
  const pn = calcNAV(fundId).pn;
  const conDato = filas.filter(f => f.tir != null || f.md != null);
  const valorTot = filas.reduce((s, f) => s + f.valor, 0);
  const valorCon = conDato.reduce((s, f) => s + f.valor, 0);
  const prom = (lista, k) => {
    const l = lista.filter(f => f[k] != null);
    const w = l.reduce((s, f) => s + f.valor, 0);
    return w > 0 ? l.reduce((s, f) => s + f[k] * f.valor, 0) / w : null;
  };
  const fTir = v => v == null ? '—' : f2(v * 100) + '%';
  const fMd  = v => v == null ? '—' : f2(v);

  // Resumen por moneda (la TIR solo se promedia dentro de la misma moneda)
  const porMon = ['USD', 'ARS'].map(mn => {
    const l = filas.filter(f => f.monedaTir === mn);
    return { mn, valor: l.reduce((s, f) => s + f.valor, 0), tir: prom(l, 'tir'), md: prom(l, 'md'),
             cob: l.length ? l.filter(f => f.tir != null || f.md != null).reduce((s, f) => s + f.valor, 0) / (l.reduce((s, f) => s + f.valor, 0) || 1) : 0 };
  }).filter(x => x.valor > 0);

  const tiles = `
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      ${statTile('Renta fija', fMon(fundId, valorTot), pn > 0 ? f2(valorTot / pn * 100) + '% del patrimonio' : '')}
      ${statTile('Duration modificada', fMd(prom(filas, 'md')), 'años, toda la renta fija')}
      ${porMon.map(x => statTile('TIR ' + (x.mn === 'USD' ? 'en dólares' : 'en pesos'), fTir(x.tir), 'MD ' + fMd(x.md) + ' · ' + fMon(fundId, x.valor))).join('')}
      ${statTile('Con datos', valorTot > 0 ? f2(valorCon / valorTot * 100) + '%' : '—', conDato.length + ' de ' + filas.length + ' instrumentos', valorCon < valorTot ? '#F59E0B' : '#2E9E2A')}
    </div>`;

  // Agrupado
  const grupos = {};
  for (const f of filas) {
    const k = A.grupo === 'tipo' ? f.tipo : (A.grupo === 'cat' ? f.cat : f.monedaTir);
    (grupos[k] = grupos[k] || []).push(f);
  }
  const filasGrupo = Object.entries(grupos).map(([k, l]) => {
    const monedas = new Set(l.filter(f => f.tir != null).map(f => f.monedaTir));
    const valor = l.reduce((s, f) => s + f.valor, 0);
    const cob = l.filter(f => f.tir != null || f.md != null).reduce((s, f) => s + f.valor, 0) / (valor || 1);
    return { k, valor, peso: pn > 0 ? valor / pn : 0, tir: monedas.size > 1 ? 'mix' : prom(l, 'tir'), md: prom(l, 'md'), cob, n: l.length };
  }).sort((a, b) => b.valor - a.valor);
  const tablaGrupo = `
    <div class="table-wrap"><table>
      <thead><tr><th>${{ moneda: 'Moneda', tipo: 'Tipo', cat: 'Categoría' }[A.grupo]}</th><th class="num">Valor</th><th class="num">% PN</th>
        <th class="num">TIR prom.</th><th class="num">Duration mod.</th><th class="num">Con datos</th></tr></thead>
      <tbody>${filasGrupo.map(g => `
        <tr><td>${g.k} <span style="color:#5A5A60;font-size:11px">(${g.n})</span></td>
          <td class="num">${fMon(fundId, g.valor)}</td><td class="num">${f2(g.peso * 100)}%</td>
          <td class="num">${g.tir === 'mix' ? '<span title="Mezcla pesos y dólares: mirá la vista por moneda" style="color:#5A5A60">monedas mixtas</span>' : fTir(g.tir)}</td>
          <td class="num">${fMd(g.md)}</td>
          <td class="num" style="color:${g.cob < 0.999 ? '#F59E0B' : '#9A9AA0'}">${f2(g.cob * 100)}%</td></tr>`).join('')}
      </tbody></table></div>`;

  // Detalle por instrumento
  const estadoChip = f => {
    if (f.estado === 'ok')   return '<span style="color:#9A9AA0;font-size:11px">' + RF_METODOS[f.p.metodo] + '</span>';
    if (f.estado === 'auto') return '<span style="color:#9A9AA0;font-size:11px">Automático (' + f.p._auto + ')</span>';
    if (f.estado === 'sin')  return '<span style="color:#F59E0B;font-size:11px;font-weight:700">Sin configurar</span>';
    return '<span style="color:#D33A3F;font-size:11px;font-weight:700" title="Revisá vencimiento, flujos o moneda">No calcula</span>';
  };
  const det = filas.sort((a, b) => b.valor - a.valor).map(f => `
    <tr>
      <td><span class="ticker-chip">${f.ticker}</span><span style="font-size:10px;color:#5A5A60;display:block;margin-top:2px">${f.tipo}</span></td>
      <td class="num">${fMon(fundId, f.valor)}</td>
      <td class="num">${f2(f.peso * 100)}%</td>
      <td class="num">${f.vto ? fDiaHist(f.vto, true) : '—'}</td>
      <td class="num">${f.monFl}</td>
      <td class="num" title="Precio por 1 de nominal en la moneda de los flujos">${f.precioFl != null ? f4(f.precioFl) : '—'}</td>
      <td class="num" style="font-weight:700">${fTir(f.tir)}</td>
      <td class="num">${fMd(f.md)}</td>
      <td>${estadoChip(f)}</td>
      <td><button onclick="abrirRfParams('${fundId}','${f.ticker}')" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#C0C0C8;padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit">✎</button></td>
    </tr>`).join('');

  const cuerpo = `
    ${panel('Renta fija · TIR y duration', tiles)}
    ${panel('Resumen', tablaGrupo, `<div style="display:flex;gap:6px">${[['moneda','Moneda'],['tipo','Tipo de activo'],['cat','Categoría']].map(([k,l]) => pillBtn(A.grupo === k, l, `state.rfVista.grupo='${k}';render()`)).join('')}</div>`)}
    ${panel('Por instrumento', `
      <div style="font-size:12px;color:#5A5A60;margin-bottom:10px">La TIR sale de los flujos y el precio actual (en vivo si hay, si no el del PDF). Con ✎ elegís el método de cada bono: cero cupón, cupón fijo, flujos cargados a mano o TIR manual (para duales, CER o bonos que amortizan si no querés cargar los flujos).</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Activo</th><th class="num">Valor</th><th class="num">% PN</th><th class="num">Vencimiento</th><th class="num">Moneda flujos</th>
          <th class="num">Precio</th><th class="num">TIR</th><th class="num">Duration mod.</th><th>Método</th><th></th></tr></thead>
        <tbody>${det || '<tr><td colspan="10" style="color:#5A5A60">No hay instrumentos de renta fija.</td></tr>'}</tbody>
      </table></div>`)}`;
  return renderToolPage(fundId, 'rf', `<button onclick="abrirImportarFlujos('${fundId}')" class="upload-btn" style="background:rgba(166,230,53,0.1);border:1px solid rgba(166,230,53,0.3);color:#A6E635">⬆ Importar flujos</button>`, cuerpo);
}

function rfMostrarCampos() {

  show('rf-g-vto', m === 'cero' || m === 'bullet');
  show('rf-g-bullet', m === 'bullet');

async function guardarRfParams(fundId, ticker) {
  const g = id => document.getElementById('rf-' + id)?.value?.trim() ?? '';
  const num = id => {
    let x = g(id).replace(/\s/g, '');
    if (x === '') return null;
    if (x.includes(',')) x = x.replace(/\./g, '').replace(',', '.');   // formato 1.234,56
    const n = parseFloat(x);
    return isFinite(n) ? n : null;
  };
  const err = document.getElementById('rf-err');
  const metodo = g('metodo');
  const row = { fund_id: fundId, ticker, metodo, moneda_flujos: g('mon'),
    vencimiento: null, cupon: null, frecuencia: null, valor_final: null, flujos: null, tir_manual: null, md_manual: null,
    updated_at: new Date().toISOString() };
  if (metodo === 'cero' || metodo === 'bullet') { row.vencimiento = g('vto') || null; row.valor_final = num('vf') ?? 1; }
  if (metodo === 'bullet') {
    row.cupon = num('cupon'); row.frecuencia = parseInt(g('freq'), 10);
    if (row.cupon == null) { err.textContent = 'Falta el cupón.'; return; }
  }
  if (metodo === 'flujos') {
    const fl = [];
    for (const ln of g('flujos').split(/\n/).map(x => x.trim()).filter(Boolean)) {
      const mm = ln.match(/^(\d{1,2}\/\d{1,2}\/\d{4}|\d{4}-\d{2}-\d{2})\s*[;\t]\s*([\d.,]+)$/);
      if (!mm) { err.textContent = 'Línea inválida: "' + ln + '". Formato: dd/mm/aaaa ; monto'; return; }
      const fecha = mm[1].includes('/') ? fechaPDFaISO(mm[1]) : mm[1];
      fl.push({ fecha, monto: mm[2].includes(',') ? parseArNum(mm[2]) : parseFloat(mm[2]) });
    }
    if (!fl.length) { err.textContent = 'Cargá al menos un flujo.'; return; }
    row.flujos = fl.sort((a, b) => a.fecha.localeCompare(b.fecha));
  }
  if (metodo === 'manual') {
    row.tir_manual = num('tir'); row.md_manual = num('md');
    if (row.tir_manual == null && row.md_manual == null) { err.textContent = 'Cargá la TIR, la duration o las dos.'; return; }
  }
  try {
    const r = await fetch(`${SB_URL}/renta_fija_params?on_conflict=fund_id,ticker`, {
      method: 'POST',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(row),
    });
    if (!r.ok) throw new Error('Supabase ' + r.status + (r.status === 404 ? ' (¿corriste herramientas.sql?)' : ''));
    (state.rfParams[fundId] = state.rfParams[fundId] || {})[ticker] = row;
    closeModal(); render();
  } catch (e) { err.textContent = 'No se pudo guardar: ' + e.message; }
}
async function borrarRfParams(fundId, ticker) {
  await fetch(`${SB_URL}/renta_fija_params?fund_id=eq.${fundId}&ticker=eq.${encodeURIComponent(ticker)}`, { method: 'DELETE', headers: SB_HDR }).catch(() => {});
  if (state.rfParams[fundId]) delete state.rfParams[fundId][ticker];
  closeModal(); render();
}

// ═══════════════════════════════════════════════════════════════════
// CALENDARIO DE VENCIMIENTOS
// ═══════════════════════════════════════════════════════════════════
// Eventos:
//   · Renta fija con flujos (configurados o automáticos): cada cupón / amortización / vencimiento,
//     importe = nominales × flujo por 1 de nominal (moneda de los flujos → moneda del fondo).
//   · Renta fija sin flujos pero con vencimiento en el PDF: un evento al vencimiento por el valor actual (estimado).
//   · Opciones abiertas (puts y calls vendidos): vencimiento con la caja que se mueve si las ejercen.
const VENC_HORIZONTES = [['30', '30 días'], ['90', '90 días'], ['180', '6 meses'], ['365', '1 año'], ['todo', 'Todo']];

function eventosVencimiento(fundId, conOpciones) {
  const hoy = fechaArgISO();
  const pn  = calcNAV(fundId).pn;
  const ev  = [];
  for (const f of calcRentaFija(fundId)) {
    const nominales = f.h.cantidad;
    if (f.flujos.length && f.fac) {
      for (const x of f.flujos) {
        const imp = nominales * x.monto;
        ev.push({ fecha: x.fecha, ticker: f.ticker, clase: 'rf', tipo: x.tipo === 'vto' ? 'Vencimiento' : 'Cupón / amortización',
                  detalle: f.tipo, importeOrig: imp, monOrig: f.monFl, importe: imp * f.fac, estimado: false });
      }
    } else if (f.vto && f.vto >= hoy) {
      ev.push({ fecha: f.vto, ticker: f.ticker, clase: 'rf', tipo: 'Vencimiento', detalle: f.tipo,
                importeOrig: null, monOrig: null, importe: f.valor, estimado: true });
    }
  }
  if (conOpciones) {
    for (const o of (state.opciones[fundId] || []).filter(o => o.estado !== 'CERRADA')) {
      const c = calcOpcion(o);
      ev.push({ fecha: o.vencimiento, ticker: o.papel, clase: 'opcion',
                tipo: (c.isPut ? 'Vence PUT' : 'Vence CALL') + ' ' + f2(c.K),
                detalle: fNum(c.E) + ' acciones · ' + (c.itm == null ? 'sin precio' : c.itm ? 'ejercible hoy' : 'fuera del dinero'),
                itm: c.itm, importeOrig: null, monOrig: null,
                // Caja si la ejercen: PUT = pagás strike (−), CALL = cobrás strike (+)
                importe: c.isPut ? -c.E * c.K : c.E * c.K, vencida: c.dias != null && c.dias < 0 });
    }
  }
  ev.forEach(e => { e.dias = diasEntre(hoy, e.fecha); e.peso = pn > 0 ? e.importe / pn : null; });
  return ev.sort((a, b) => a.fecha.localeCompare(b.fecha) || a.ticker.localeCompare(b.ticker));
}

function renderVencimientos(fundId) {
  const V = state.vencVista || (state.vencVista = { horizonte: '90', opciones: true });
  const todos = eventosVencimiento(fundId, V.opciones);
  const lim = V.horizonte === 'todo' ? Infinity : +V.horizonte;
  const vencidas = todos.filter(e => e.vencida);
  const lista = todos.filter(e => !e.vencida && e.dias >= 0 && e.dias <= lim);
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const sumRf = (l) => l.filter(e => e.clase === 'rf').reduce((s, e) => s + e.importe, 0);
  const prox = d => sumRf(todos.filter(e => !e.vencida && e.dias >= 0 && e.dias <= d));
  const optEnRango = lista.filter(e => e.clase === 'opcion');
  const putsItm = optEnRango.filter(e => e.importe < 0 && e.itm).reduce((s, e) => s + e.importe, 0);
  const sinFlujos = calcRentaFija(fundId).filter(f => !f.flujos.length && f.p?.metodo !== 'manual').length;

  const tiles = `
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      ${statTile('Cobros próximos 30 días', fMon(fundId, prox(30)), 'renta fija')}
      ${statTile('Cobros próximos 90 días', fMon(fundId, prox(90)), 'renta fija')}
      ${statTile('Cobros en el horizonte', fMon(fundId, sumRf(lista)), lista.filter(e => e.clase === 'rf').length + ' eventos')}
      ${V.opciones ? statTile('Opciones que vencen', String(optEnRango.length), putsItm < 0 ? fMon(fundId, putsItm) + ' en puts ejercibles' : 'ningún put ejercible', putsItm < 0 ? '#F59E0B' : null) : ''}
    </div>
    ${sinFlujos ? `<div style="font-size:12px;color:#5A5A60;margin-top:12px">${sinFlujos} instrumento${sinFlujos > 1 ? 's' : ''} de renta fija sin flujos configurados: figuran solo al vencimiento y por su valor actual (marcados “estimado”). Configuralos en la pestaña Renta fija o con <a href="#" onclick="abrirImportarFlujos('${fundId}');return false" style="color:#A6E635">Importar flujos</a> para ver cupones y amortizaciones.</div>` : ''}`;

  // Barras por mes (solo renta fija)
  const porMes = {};
  for (const e of lista.filter(e => e.clase === 'rf')) porMes[e.fecha.slice(0, 7)] = (porMes[e.fecha.slice(0, 7)] || 0) + e.importe;
  const meses = Object.entries(porMes).sort();
  const maxMes = Math.max(...meses.map(([, v]) => v), 1);
  const barras = meses.length ? `
    <div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px">
      ${meses.map(([k, v]) => `
        <div style="flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${MES[+k.slice(5) - 1]} ${k.slice(0, 4)}: ${fMon(fundId, v)}">
          <div style="font-size:10px;color:#9A9AA0;font-family:'JetBrains Mono',monospace;margin-bottom:4px;white-space:nowrap">${_ar0.format(Math.round(v / 1000))}k</div>
          <div style="width:100%;max-width:46px;height:${Math.max(2, v / maxMes * 100)}px;background:#A6E635;border-radius:4px 4px 0 0"></div>
          <div style="font-size:11px;color:#5A5A60;margin-top:6px">${MES[+k.slice(5) - 1].slice(0, 3)} ${k.slice(2, 4)}</div>
        </div>`).join('')}
    </div>` : '<div style="color:#5A5A60;font-size:13px">Sin cobros de renta fija en el horizonte.</div>';

  // Tabla agrupada por mes
  const fila = e => `
    <tr${e.clase === 'opcion' ? ' style="background:rgba(56,189,248,0.04)"' : ''}>
      <td class="num">${fDiaHist(e.fecha, true)}</td>

// RESULTADO VS COSTO
// ═══════════════════════════════════════════════════════════════════
// Costo = "Precio inicial" del panel de Activos (misma escala que el precio de la tabla:
// por lámina, en moneda del fondo). Es el mismo dato que usa la columna "Var. hist." de la cartera.
// Resultado = nominales × (precio actual − costo) / lámina   (al revés en posiciones vendidas).
// El costo del PDF (columna "Costo") se muestra de referencia y sirve para completar los vacíos.
function calcResultadoCosto(fundId) {
  const pn = calcNAV(fundId).pn;
  return valuarTenencias(fundId).filter(v => v.m?.tipo !== 'Futuro de Dólar').map(v => {
    const piDisp   = v.m?.precioInicial > 0 ? v.m.precioInicial : null;     // por lámina
    const precioU  = v.price / v.lamina;                                    // por unidad
    const costoU   = piDisp != null ? piDisp / v.lamina : null;
    const costoPdf = v.h.costo > 0 ? v.h.costo : null;                      // por unidad (PDF)
    const sg = v.corto ? -1 : 1;
    const resultado = costoU != null ? sg * v.h.cantidad * (precioU - costoU) : null;
    const varPct = costoU > 0 ? (v.corto ? costoU / precioU - 1 : precioU / costoU - 1) : null;
    const difPdf = costoU && costoPdf ? costoU / costoPdf - 1 : null;
    return { ...v, precioU, costoU, costoPdf, difPdf, resultado, varPct,
             costoTotal: costoU != null ? sg * v.h.cantidad * costoU : null, peso: pn > 0 ? v.monto / pn : 0 };
  });
}

async function patchPrecioInicial(fundId, ticker, precioInicial) {
  const r = await fetch(`${SB_URL}/${ACTIVOS_TABLE[fundId]}?ticker=eq.${encodeURIComponent(ticker)}`, {
    method: 'PATCH',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ precio_inicial: precioInicial }),
  });
  if (!r.ok) throw new Error('Supabase ' + r.status);
}

async function completarCostosPDF(fundId) {
  const lista = calcResultadoCosto(fundId).filter(f => f.costoU == null && f.costoPdf);
  showModal(`<div class="modal-box" style="max-width:340px;padding:40px;text-align:center"><div class="spinner" style="margin:0 auto 16px"></div>
    <div style="color:#9A9AA0;font-size:14px;font-weight:600">Guardando ${lista.length} costos…</div></div>`);
  let ok = 0;
  for (const f of lista) {
    try { await patchPrecioInicial(fundId, f.ticker, f.costoPdf * f.lamina); ok++; } catch (e) { console.warn('[iEB] costo', f.ticker, e.message); }
  }
  state.meta = await cargarMeta();
  closeModal(); render();
  if (ok < lista.length) showModal(`<div class="modal-box" style="max-width:380px;padding:28px"><div style="font-weight:700;margin-bottom:8px">Se guardaron ${ok} de ${lista.length}</div>

}

async function guardarCosto(fundId, ticker, lamina) {
  const v = parseFloat((document.getElementById('co-val')?.value || '').replace(',', '.'));

  try { await patchPrecioInicial(fundId, ticker, v * lamina); state.meta = await cargarMeta(); closeModal(); render(); }
  catch (e) { err.textContent = 'No se pudo guardar: ' + e.message + ' (¿el activo está dado de alta en Activos?)'; }
}

// ═══════════════════════════════════════════════════════════════════
// CONCENTRACIÓN Y LÍMITES
// ═══════════════════════════════════════════════════════════════════
// Pesos = exposición / patrimonio, igual que la columna "% PN" de la cartera
// (opciones vendidas por su nocional, liquidez neta de la reserva por opciones).
// "Disponibilidades y otros" = patrimonio − tenencias (ajustes del PDF y honorarios).
const LIM_DIMS = [['tipo', 'Tipo'], ['moneda', 'Moneda'], ['categoria', 'Categoría']];

function itemsExposicion(fundId) {
  const pn = calcNAV(fundId).pn;
  const fondoMon = FUNDS_CONFIG[fundId]?.moneda || 'ARS';
  const items = calcMontosCartera(fundId).filter(i => i.meta?.tipo !== 'Futuro de Dólar').map(i => ({
    ticker: i.ticker, monto: i.montoDisplay,
    tipo: i._isCoveredCall ? 'Covered Call' : (i.meta?.tipo || 'Otros'),
    categoria: i.meta?.categoria || 'Sin categoría', moneda: i.meta?.moneda || fondoMon,
    liq: esLiquidez(i.meta),
  }));
  const resto = pn - items.reduce((s, i) => s + i.monto, 0);
  if (Math.abs(resto) > 0.5) items.push({ ticker: 'Disponibilidades y otros', monto: resto, tipo: 'Liquidez', categoria: 'Liquidez', moneda: fondoMon, liq: true, _otros: true });
  return { items, pn };
}

function pesosDe(items, pn) {
  const out = { activo: {}, tipo: {}, moneda: {}, categoria: {}, liquidez: 0 };
  if (!(pn > 0)) return out;
  for (const i of items) {
    const w = i.monto / pn;
    if (!i._otros) out.activo[i.ticker] = (out.activo[i.ticker] || 0) + w;
    out.tipo[i.tipo] = (out.tipo[i.tipo] || 0) + w;
    out.moneda[i.moneda] = (out.moneda[i.moneda] || 0) + w;
    out.categoria[i.categoria] = (out.categoria[i.categoria] || 0) + w;
    if (i.liq) out.liquidez += w;
  }
  return out;
}

function getLimite(fundId, tipo, clave = '') {
  return (state.limites[fundId] || []).find(l => l.tipo === tipo && l.clave === clave) || null;
}

function evaluarLimites(fundId, pesos) {
  const res = [];
  const gen = getLimite(fundId, 'general_activo')?.max ?? null;
  const est = (peso, lim) => lim == null ? 'sin' : (peso > lim / 100 + 1e-9 ? 'excedido' : peso >= 0.9 * lim / 100 ? 'cerca' : 'ok');
  for (const [k, w] of Object.entries(pesos.activo)) {
    const esp = getLimite(fundId, 'activo', k)?.max ?? null;
    const lim = esp ?? gen;
    res.push({ dim: 'activo', clave: k, peso: w, limite: lim, especifico: esp != null, estado: est(Math.abs(w), lim) });
  }
  for (const [dim] of LIM_DIMS) {
    for (const [k, w] of Object.entries(pesos[dim])) {
      const lim = getLimite(fundId, dim, k)?.max ?? null;
      res.push({ dim, clave: k, peso: w, limite: lim, especifico: lim != null, estado: est(Math.abs(w), lim) });
    }
  }
  const lmin = getLimite(fundId, 'liquidez_min')?.min ?? null;
  if (lmin != null) {
    const w = pesos.liquidez;
    res.push({ dim: 'liquidez', clave: 'Liquidez mínima', peso: w, limite: lmin, minimo: true,
               estado: w < lmin / 100 - 1e-9 ? 'excedido' : w < lmin / 100 * 1.1 ? 'cerca' : 'ok' });
  }
  return res;
}

function alertasConcentracion(fundId) {
  if (!FUNDS_CONFIG[fundId]) return [];
  const { items, pn } = itemsExposicion(fundId);
  return evaluarLimites(fundId, pesosDe(items, pn)).filter(a => a.estado === 'excedido' || a.estado === 'cerca');
}

async function guardarLimite(fundId, tipo, clave, valor) {
  const txt = String(valor ?? '').trim().replace(',', '.');
  const lista = (state.limites[fundId] = state.limites[fundId] || []);
  const idx = lista.findIndex(l => l.tipo === tipo && l.clave === clave);
  try {
    if (txt === '') {
      await fetch(`${SB_URL}/limites?fund_id=eq.${fundId}&tipo=eq.${tipo}&clave=eq.${encodeURIComponent(clave)}`, { method: 'DELETE', headers: SB_HDR });
      if (idx >= 0) lista.splice(idx, 1);
    } else {
      const n = parseFloat(txt);
      if (!isFinite(n) || n < 0) return;
      const row = { fund_id: fundId, tipo, clave, max_pct: tipo === 'liquidez_min' ? null : n, min_pct: tipo === 'liquidez_min' ? n : null, updated_at: new Date().toISOString() };
      const r = await fetch(`${SB_URL}/limites?on_conflict=fund_id,tipo,clave`, {
        method: 'POST', headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(row),
      });
      if (!r.ok) throw new Error('Supabase ' + r.status);
      const l = { tipo, clave, max: row.max_pct, min: row.min_pct };
      if (idx >= 0) lista[idx] = l; else lista.push(l);
    }
  } catch (e) { console.warn('[iEB] guardarLimite:', e.message); alert('No se pudo guardar el límite (¿corriste herramientas.sql?)'); }
  render();
}

// SIMULADOR DE OPERACIONES
// ═══════════════════════════════════════════════════════════════════
// Operaciones hipotéticas (no se guardan): compras y ventas a precio de mercado.
//   Compra con fondeo "liquidez": sale de los activos de liquidez en proporción a su monto
//     (si no alcanza, de "Disponibilidades y otros", que puede quedar negativo).
//   Compra con "aporte": entra plata nueva → sube el patrimonio.
//   Venta: el producido va a "Disponibilidades y otros" (o sale como rescate).
function simOps(fundId) { return (state.sim = state.sim || {})[fundId] = state.sim[fundId] || []; }

function simAplicar(fundId) {
  const base = itemsExposicion(fundId);
  const items = base.items.map(i => ({ ...i }));
  let pn = base.pn;
  const fondoMon = FUNDS_CONFIG[fundId]?.moneda || 'ARS';
  const otros = () => {
    let o = items.find(i => i._otros);
    if (!o) { o = { ticker: 'Disponibilidades y otros', monto: 0, tipo: 'Liquidez', categoria: 'Liquidez', moneda: fondoMon, liq: true, _otros: true }; items.push(o); }
    return o;
  };
  const avisos = [];
  for (const op of simOps(fundId)) {
    let it = items.find(i => i.ticker === op.ticker && !i._otros);
    if (!it) {
      it = { ticker: op.ticker, monto: 0, tipo: op.tipo || 'Otros', categoria: op.categoria || 'Sin categoría', moneda: op.moneda || fondoMon, liq: op.categoria === 'Liquidez', _nuevo: true };
      items.push(it);
    }
    let monto = op.monto;
    if (op.accion === 'venta') {
      if (monto > it.monto + 0.5) { avisos.push(`Venta de ${op.ticker} mayor a la tenencia: se limita a ${fMon(fundId, it.monto)}.`); monto = Math.max(0, it.monto); }
      it.monto -= monto;
      if (op.fondeo === 'rescate') pn -= monto; else otros().monto += monto;
    } else {
      it.monto += monto;
      if (op.fondeo === 'aporte') pn += monto;
      else {
        const liq = items.filter(i => i.liq && !i._otros && i !== it && i.monto > 0);
        const tot = liq.reduce((s, i) => s + i.monto, 0);
        const deLiq = Math.min(monto, tot);
        liq.forEach(i => { i.monto -= deLiq * i.monto / tot; });
        if (monto - deLiq > 0.5) { otros().monto -= monto - deLiq; avisos.push(`No alcanza la liquidez para ${op.ticker}: ${fMon(fundId, monto - deLiq)} salen de disponibilidades.`); }
      }
    }
  }
  return { antes: base, despues: { items, pn }, avisos };
}
