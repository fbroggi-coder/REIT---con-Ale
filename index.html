function simAgregar(fundId) {
  const g = id => document.getElementById(id)?.value?.trim() ?? '';
  const err = document.getElementById('sim-err');
  const accion = g('sim-acc');
  let ticker = g('sim-tk');
  const monto = parseFloat(g('sim-monto').replace(',', '.'));
  if (!(monto > 0)) { err.textContent = 'Ingresá un monto mayor a cero.'; return; }
  const op = { accion, ticker, monto, fondeo: g('sim-fondeo') };
  if (ticker === '__nuevo') {
    if (accion === 'venta') { err.textContent = 'Solo se puede vender un activo que está en cartera.'; return; }
    ticker = g('sim-ntk').toUpperCase();
    if (!ticker) { err.textContent = 'Poné el ticker del activo nuevo.'; return; }
    Object.assign(op, { ticker, nuevo: true, tipo: g('sim-ntipo') || 'Otros', categoria: g('sim-ncat') || 'Sin categoría', moneda: g('sim-nmon') || 'USD' });
  }
  simOps(fundId).push(op);
  render();
}
function simQuitar(fundId, i) { simOps(fundId).splice(i, 1); render(); }

// ═══════════════════════════════════════════════════════════════════
// IMPORTAR FLUJOS DE RENTA FIJA (pegar desde Excel o subir .xlsx/.csv)
// ═══════════════════════════════════════════════════════════════════
// Cada fila se detecta sola:
//   Flujos  → ticker | fecha | monto por 1 de nominal [| moneda]
//             (varias filas por ticker = cronograma; una sola fila = cero cupón / LECAP)
//   Bullet  → ticker | cupón % anual | pagos por año [| vencimiento] [| moneda]
// Moneda opcional: USD, USD cable (o "cable"), ARS (o "pesos"). Sin moneda se mantiene la
// configurada, o se deduce del activo. Filas de encabezado o vacías se ignoran.
let _impPend = null;

function impNum(x) {
  if (typeof x === 'number') return x;
  let s = String(x ?? '').trim().replace(/\s|%/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const IMP_MESES = { ene: 1, jan: 1, feb: 2, mar: 3, abr: 4, apr: 4, may: 5, jun: 6, jul: 7, ago: 8, aug: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12, dec: 12 };
function impFecha(x) {
  if (x instanceof Date && !isNaN(x)) return isoLocal(x);
  if (typeof x === 'number' && x > 20000 && x < 80000) {          // serial de Excel
    return isoLocal(new Date(Math.round((x - 25569) * 86400000) + 12 * 3600000));
  }
  const s = String(x ?? '').trim().toLowerCase();
  const arma = (d, mo, y) => {
    y = String(y).length === 2 ? '20' + y : String(y);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  };
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) return arma(+m[1], +m[2], m[3]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\s\-\/.]*(?:de\s+)?([a-zé]{3})[a-zé]*\.?[\s\-\/.,]*(?:de\s+)?(\d{2,4})$/);      // 09-ene-2027, 9 de enero de 2027
  if (m && IMP_MESES[m[2]]) return arma(+m[1], IMP_MESES[m[2]], m[3]);
  return null;
}
function impMoneda(x) {
  const s = String(x ?? '').trim().toLowerCase();
  if (!s || s.length > 12) return null;
  if (/cable|ccl/.test(s)) return 'USD cable';
  if (/^(usd|u\$s|us\$|dolar(es)?|dólar(es)?|mep)$/.test(s)) return 'USD';
  if (/^(ars|\$|pesos?)$/.test(s)) return 'ARS';
  return null;
}
// ¿La celda parece un ticker? (no fecha, no número, sin espacios internos largos)
function impPareceTicker(x) {
  if (x == null || x === '' || x instanceof Date || typeof x === 'number') return false;
  const s = String(x).trim();
  if (impFecha(s) || impNum(s) != null || impMoneda(s)) return false;
  return /^#?[A-Za-z][A-Za-z0-9.\-]{1,14}$/.test(s.split(/\s+/)[0]);
}
// Busca el ticker en la cartera: exacto, o con/sin la "D" final (AL30 ↔ AL30D), o sin ".BA"
function impTicker(fundId, raw) {
  const t = String(raw ?? '').trim().toUpperCase().replace(/^#/, '').split(/\s+/)[0].replace(/\.BA$/, '');
  if (!t) return null;
  const tk = new Set((state.holdings[fundId] || []).map(h => h.ticker));
  if (tk.has(t)) return { ticker: t, enCartera: true };
  for (const c of [t + 'D', t.replace(/[DO]$/, '') + 'D', t.replace(/D$/, ''), t + 'C']) if (tk.has(c)) return { ticker: c, enCartera: true, desde: t };
  return { ticker: t, enCartera: false };
}

// Detecta una fila de encabezado y mapea columnas por nombre
const IMP_COLS = {
  tk:     /^(ticker|especie|bono|activo|papel|s[ií]mbolo|instrumento|c[oó]digo)$/,
  fecha:  /^(fecha( de pago)?|fecha pago|pago|date|fecha de cobro|vto\.? cup[oó]n)$/,
  total:  /^(total|flujo|flujo total|monto|importe|pago total|cash ?flow|renta \+ amort.*|total a cobrar)$/,
  renta:  /^(renta|inter[eé]s(es)?|cup[oó]n|coupon|renta \(.*\))$/,
  amort:  /^(amort\.?|amortizaci[oó]n|capital|amortizaci[oó]n \(.*\))$/,
  moneda: /^(moneda|currency|mon\.?)$/,
  cupPct: /^(cup[oó]n ?%|cup[oó]n % anual|tasa|tasa %|rate|tna)$/,
  freq:   /^(frecuencia|pagos por a[nñ]o.*|freq\.?|pagos\/a[nñ]o)$/,
  vto:    /^(vencimiento|vto\.?|maturity|fecha de vencimiento)$/,
};
function impHeader(filas) {
  for (let i = 0; i < Math.min(filas.length, 12); i++) {
    const map = {};
    (filas[i] || []).forEach((c, j) => {
      const s = String(c ?? '').trim().toLowerCase().replace(/\s*\(.*?\)\s*$/, '').replace(/\s+/g, ' ');
      for (const [k, re] of Object.entries(IMP_COLS)) if (map[k] == null && re.test(s)) { map[k] = j; break; }
    });
    const n = Object.keys(map).length;
    if (n >= 2 && (map.fecha != null || map.cupPct != null)) return { fila: i, map };
  }
  return null;
}

// bloques: [{ nombre, filas }]  (una hoja de Excel o el texto pegado)
// opts: { tickerDefault, por100: 'auto' | '1' | '100' }
function impParsear(fundId, bloques, opts = {}) {
  const flujos = {}, bullets = {}, monedas = {}, origen = {}, ignoradas = [];
  const def = opts.tickerDefault ? impTicker(fundId, opts.tickerDefault) : null;
  const addFlujo = (tk, fecha, monto, src) => {
    (flujos[tk.ticker] = flujos[tk.ticker] || { tk, l: [] }).l.push({ fecha, monto });
    origen[tk.ticker] = origen[tk.ticker] || src;
  };

  for (const { nombre, filas } of bloques) {
    const hoja = nombre && impPareceTicker(nombre) ? impTicker(fundId, nombre) : null;
    const hojaOk = hoja?.enCartera ? hoja : null;
    let ultimo = null;   // especie "arrastrada" de filas anteriores
    const tkDe = (cell) => {
      if (impPareceTicker(cell)) { ultimo = impTicker(fundId, cell); return [ultimo, 'archivo']; }
      if (ultimo) return [ultimo, 'arrastrada'];
      if (hojaOk) return [hojaOk, 'nombre de la hoja'];
      if (def) return [def, 'elegida'];
      return [null, null];
    };
    const hdr = impHeader(filas);

    filas.forEach((cells, i) => {
      const fila = i + 1;
      const raw = (cells || []);
      const txt = raw.filter(x => x !== '' && x != null).join(' | ');
      if (!txt) return;

      // ── Con encabezado: columnas por nombre ───────────────────────
      if (hdr) {
        if (i <= hdr.fila) return;
        const M = hdr.map, get = k => M[k] != null ? raw[M[k]] : undefined;
        let tk, src;
        if (M.tk != null && impPareceTicker(get('tk'))) { tk = ultimo = impTicker(fundId, get('tk')); src = 'archivo'; }
        else [tk, src] = tkDe(null);
        if (/^total/i.test(String(raw[0] ?? '')) || /^total/i.test(String(get('tk') ?? ''))) return;   // fila de totales
        const mon = impMoneda(get('moneda'));
        const fecha = impFecha(get('fecha'));
        if (fecha) {
          let monto = M.total != null ? impNum(get('total')) : null;
          if (monto == null && (M.renta != null || M.amort != null)) monto = (impNum(get('renta')) || 0) + (impNum(get('amort')) || 0);
          if (monto == null || monto <= 0) return;                                     // filas sin pago
          if (!tk) { ignoradas.push({ fila, txt, motivo: 'no se sabe la especie' }); return; }
          addFlujo(tk, fecha, monto, src);
          if (mon) monedas[tk.ticker] = mon;
          return;
        }
        if (M.cupPct != null && impNum(get('cupPct')) != null && tk) {
          let cupon = impNum(get('cupPct')); const freq = Math.round(impNum(get('freq')) || 2);
          if (cupon > 0 && cupon < 0.5 && !String(get('cupPct')).includes('%')) cupon *= 100;
          bullets[tk.ticker] = { tk, cupon, frecuencia: freq, vencimiento: impFecha(get('vto')) };
          origen[tk.ticker] = origen[tk.ticker] || src;
          if (mon) monedas[tk.ticker] = mon;
          return;
        }
        // Sin fecha ni columnas de cupón: se intenta leer la fila por posición (abajo)
      }

      // ── Sin encabezado (o fila que no encaja en él): por posición ─
      const c = raw.map(x => (typeof x === 'string' ? x.trim() : x)).filter(x => x !== '' && x != null);
      if (/^(ticker|especie|activo|bono|papel|fecha)$/i.test(String(c[0]).trim())) return;      // encabezado suelto
      if (c.length === 1 && impPareceTicker(c[0])) { ultimo = impTicker(fundId, c[0]); return; } // título con la especie
      let tk, src, resto;
      if (impPareceTicker(c[0])) { [tk, src] = tkDe(c[0]); resto = c.slice(1); }
      else { [tk, src] = tkDe(null); resto = c; }
      if (!tk) { ignoradas.push({ fila, txt, motivo: 'no se sabe la especie' }); return; }
      const mon = resto.map(impMoneda).find(Boolean) || null;
      resto = resto.filter(x => !impMoneda(x));
      const f1 = impFecha(resto[0]);
      if (f1) {
        // fecha | monto   o   fecha | renta | amortización [| total]
        const nums = resto.slice(1).map(impNum).filter(n => n != null);
        if (!nums.length) { ignoradas.push({ fila, txt, motivo: 'falta el monto' }); return; }
        const monto = nums.length >= 3 ? nums[2] : nums.length === 2 ? nums[0] + nums[1] : nums[0];
        if (monto <= 0) return;
        addFlujo(tk, f1, monto, src);
      } else {
        let cupon = impNum(resto[0]); const freq = impNum(resto[1]);
        if (cupon == null || freq == null) { ignoradas.push({ fila, txt, motivo: 'formato no reconocido' }); return; }
        if (cupon > 0 && cupon < 0.5 && !String(resto[0]).includes('%')) cupon *= 100;
        if (![1, 2, 4, 12].includes(Math.round(freq))) { ignoradas.push({ fila, txt, motivo: 'pagos por año debe ser 1, 2, 4 o 12' }); return; }
        bullets[tk.ticker] = { tk, cupon, frecuencia: Math.round(freq), vencimiento: impFecha(resto[2]) };
        origen[tk.ticker] = origen[tk.ticker] || src;
      }
      if (mon) monedas[tk.ticker] = mon;
    });
  }

  const meta = state.meta[fundId] || {};
  const actual = state.rfParams[fundId] || {};
  const monedaDe = t => monedas[t] || actual[t]?.moneda_flujos || rfAuto(t, meta[t])?.moneda_flujos || (meta[t]?.moneda === 'ARS' ? 'ARS' : 'USD');
  const vtoPDF = t => (state.holdings[fundId] || []).find(h => h.ticker === t)?.vencimiento || null;
  const rows = [];
  for (const [t, { tk, l }] of Object.entries(flujos)) {
    const fl = l.sort((a, b) => a.fecha.localeCompare(b.fecha));
    const dedup = [];
    for (const x of fl) {                                   // misma fecha repetida → se suman (ej. renta y amortización en filas separadas)
      const prev = dedup[dedup.length - 1];
      if (prev && prev.fecha === x.fecha) prev.monto += x.monto; else dedup.push({ ...x });
    }
    // ¿Montos por 100 de nominal? Un bono por 1 de nominal paga en total ~1 a 3; por 100, ~100 a 300
    const suma = dedup.reduce((s, x) => s + x.monto, 0);
    const por100 = opts.por100 === '100' || (opts.por100 !== '1' && (dedup.length === 1 ? dedup[0].monto > 20 : suma > 20));
    if (por100) dedup.forEach(x => { x.monto /= 100; });
    const row = { fund_id: fundId, ticker: t, metodo: dedup.length === 1 ? 'cero' : 'flujos', moneda_flujos: monedaDe(t),
      vencimiento: null, cupon: null, frecuencia: null, valor_final: null, flujos: null, tir_manual: null, md_manual: null };
    if (row.metodo === 'cero') { row.vencimiento = dedup[0].fecha; row.valor_final = dedup[0].monto; }
    else row.flujos = dedup;
    rows.push({ row, tk, n: dedup.length, por100, origen: origen[t] });
  }
  for (const [t, b] of Object.entries(bullets)) {
    if (flujos[t]) continue;
    rows.push({ tk: b.tk, n: null, origen: origen[t], row: { fund_id: fundId, ticker: t, metodo: 'bullet', moneda_flujos: monedaDe(t),
      vencimiento: b.vencimiento, cupon: b.cupon, frecuencia: b.frecuencia, valor_final: 1, flujos: null, tir_manual: null, md_manual: null } });
  }
  const hoy = fechaArgISO();
  for (const r of rows) {
    r.reemplaza = !!actual[r.row.ticker];
    const fl = rfFlujos(r.row, vtoPDF(r.row.ticker), hoy);
    r.prox = fl[0] || null;
    r.nFut = fl.length;
    r.sinVto = r.row.metodo === 'bullet' && !r.row.vencimiento && !vtoPDF(r.row.ticker);
  }
  return { rows: rows.sort((a, b) => a.row.ticker.localeCompare(b.row.ticker)), ignoradas };
}

function impOpts() {
  return { tickerDefault: document.getElementById('imp-tk')?.value || '', por100: document.getElementById('imp-escala')?.value || 'auto' };
}
function impTextoAFilas(txt) {
  return txt.split(/\r?\n/).map(l => l.includes('\t') ? l.split('\t') : l.includes(';') ? l.split(';') : l.split(/\s*,\s*(?=\S)|\s{2,}/));
}

async function impLeerArchivo(fundId, file) {
  if (!file) return;
  const err = document.getElementById('imp-err');
  const opts = impOpts();
  try {
    const bloques = [];
    if (/\.(csv|txt)$/i.test(file.name)) bloques.push({ nombre: file.name.replace(/\.\w+$/, ''), filas: impTextoAFilas(await file.text()) });
    else {
      await cargarXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      for (const n of wb.SheetNames) bloques.push({ nombre: n, filas: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) });
      // Un solo bloque sin especie en ningún lado → probar con el nombre del archivo (ej. "AL30.xlsx")
      if (bloques.length === 1 && !opts.tickerDefault) {
        const base = file.name.replace(/\.\w+$/, '').split(/[\s_\-]+/)[0];
        if (impPareceTicker(base) && impTicker(fundId, base)?.enCartera) opts.tickerDefault = base;
      }
    }
    impMostrarPreview(fundId, bloques, opts);
  } catch (e) { if (err) err.textContent = 'No se pudo leer el archivo: ' + e.message; }
}

function impPrevisualizar(fundId) {
  const txt = document.getElementById('imp-txt')?.value || '';
  if (!txt.trim()) { document.getElementById('imp-err').textContent = 'Pegá los datos o subí un archivo.'; return; }
  impMostrarPreview(fundId, [{ nombre: '', filas: impTextoAFilas(txt) }], impOpts());
}

    return;

  _impPend = { fundId, rows };
  const det = r => r.row.metodo === 'bullet'
    ? `${f2(r.row.cupon)}% · ${{ 1: 'anual', 2: 'semestral', 4: 'trimestral', 12: 'mensual' }[r.row.frecuencia] || r.row.frecuencia + '/año'}`
    : r.row.metodo === 'cero' ? `pago final ${f4(r.row.valor_final)}` : `${r.n} pagos`;

      <td style="padding:6px 10px;font-size:12px;color:#C0C0C8">${RF_METODOS[r.row.metodo]}</td>
      <td style="padding:6px 10px;font-size:12px;font-family:'JetBrains Mono',monospace">${det(r)}</td>
      <td style="padding:6px 10px;font-size:12px">${r.row.moneda_flujos}</td>
      <td style="padding:6px 10px;font-size:12px;font-family:'JetBrains Mono',monospace">${r.prox ? fDiaHist(r.prox.fecha, true) + ' · ' + f4(r.prox.monto) : '—'}</td>
      <td style="padding:6px 10px;font-size:11px;color:${!r.tk.enCartera || r.sinVto || !r.nFut ? '#F59E0B' : '#9A9AA0'}">
        ${[!r.tk.enCartera ? 'no está en cartera' : '', r.sinVto ? 'falta vencimiento' : '', r.tk.enCartera && !r.sinVto && !r.nFut ? 'sin pagos futuros' : '',
           r.por100 ? 'montos por 100 → divididos por 100' : '', r.reemplaza ? 'reemplaza la configuración actual' : ''].filter(Boolean).join(' · ') || 'OK'}</td>
    </tr>`).join('');
  showModal(`
    <div class="modal-box" style="max-width:840px">

        <button onclick="closeModal()" style="background:none;border:none;color:#9A9AA0;cursor:pointer;font-size:18px">✕</button>
      </div>
      <div class="modal-body">

        <div style="font-size:11px;color:#5A5A60;margin-top:10px">Los montos quedan por 1 de nominal y en la moneda indicada. Después podés revisar o corregir cada bono con ✎ en Renta fija.</div>
        <div id="imp-err2" style="color:#D33A3F;font-size:12px;font-weight:600;margin-top:6px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="abrirImportarFlujos('${fundId}')">← Volver</button>
        <button class="btn-primary" onclick="impConfirmar()">✓ Importar ${rows.length}</button>

async function impConfirmar() {
  if (!_impPend) return;
  const { fundId, rows } = _impPend;
  const err = document.getElementById('imp-err2');
  const body = rows.map(r => ({ ...r.row, updated_at: new Date().toISOString() }));
  try {
    const r = await fetch(`${SB_URL}/renta_fija_params?on_conflict=fund_id,ticker`, {
      method: 'POST',
      headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('Supabase ' + r.status + (r.status === 404 ? ' (¿corriste herramientas.sql?)' : ''));
    const dest = (state.rfParams[fundId] = state.rfParams[fundId] || {});
    for (const b of body) dest[b.ticker] = b;
    _impPend = null;
    closeModal(); render();
  } catch (e) { if (err) err.textContent = 'No se pudo importar: ' + e.message; }
}

    for (const f of rf) {
      if (f.p?.metodo === 'flujos') for (const x of f.flujos) hFl.push([f.ticker, fDiaHist(x.fecha, true), x.monto, f.monFl]);

// ═══════════════════════════════════════════════════════════════════
// ATRIBUCIÓN DE PERFORMANCE
// ═══════════════════════════════════════════════════════════════════
// Método (buy & hold entre cierres consecutivos):
//   contribución_i,t = signo × cantidad_i,t-1 × (P_i,t − P_i,t-1) / PN_t-1
//   PN_t-1 = Σ montos (cortos con signo −) + ajustes del PDF
//   Efecto TC: si la moneda del activo ≠ la del fondo, se separa la parte que
//   viene de la variación del MEP (fx_history) de la que viene del precio local.
//   Residuo_t = rendimiento oficial (NAV_t / NAV_t-1 − 1) − Σ contribuciones
//             → honorarios, suscripciones/rescates, compras/ventas en el día, etc.
// Varios días se encadenan ponderando cada día por el crecimiento acumulado
// previo: Σ_t R_t × Π_{s<t}(1+R_s) = Π(1+R_t) − 1  → la suma cierra exacto.
const ATRIB_RANGOS = [['HOY', 'Hoy (en vivo)'], ['1S', '1 semana'], ['1M', '1 mes'], ['3M', '3 meses'], ['CUSTOM', 'Personalizado']];
const ATRIB_GRUPOS = [['activo', 'Activo'], ['tipo', 'Tipo'], ['cat', 'Categoría'], ['moneda', 'Moneda']];

async function sbGetAll(pathBase) {
  const out = [], PAGE = 1000;
  for (let offset = 0; ; offset += PAGE) {
    const rows = await sbGet(`${pathBase}&limit=${PAGE}&offset=${offset}`);
    out.push(...rows);
    if (rows.length < PAGE) break;
  }
  return out;
}

async function cargarCierres(fundId) {
  try {
    const rows = await sbGetAll(`/cierres_fondo?select=fecha,holdings,ajustes,nav&fund_id=eq.${fundId}&order=fecha.asc`);
    return rows.map(r => ({ fecha: r.fecha, holdings: r.holdings || [], ajustes: r.ajustes || [], nav: r.nav != null ? +r.nav : null }));
  } catch (e) {
    console.warn('[iEB] cargarCierres (¿existe la tabla cierres_fondo?):', e.message);
    return [];
  }
}

async function cargarFxSerie() {
  try {
    const rows = await sbGetAll('/fx_history?select=fecha,mep&order=fecha.asc');
    return rows.filter(r => +r.mep > 0).map(r => ({ fecha: r.fecha, mep: +r.mep }));
  } catch (e) { return []; }
}
function mepAl(fecha) {
  let r = 0;
  for (const p of (state.atrib.fx || [])) { if (p.fecha <= fecha) r = p.mep; else break; }
  return r;
}

// Cierres guardados + el del último PDF cargado (si todavía no está guardado)
function cierresFondo(fundId) {
  const lista = [...(state.atrib.cierres || [])];
  const cfg = FUNDS_CONFIG[fundId] || {};
  const f = fechaPDFaISO(cfg.pdfDate);
  if (f && !lista.some(c => c.fecha === f) && (state.holdings[fundId] || []).length) {
    lista.push({ fecha: f, holdings: state.holdings[fundId], ajustes: AJUSTES[fundId] || [], nav: cfg.navCierre || null, _local: true });
    lista.sort((a, b) => a.fecha.localeCompare(b.fecha));
  }
  return lista;
}

async function guardarCierre(fundId, data) {
  const fecha = fechaPDFaISO(data.fecha);
  if (!fecha) throw new Error('el PDF no tiene fecha legible');
  const row = {
    fund_id: fundId, fecha,
    holdings: data.holdings.map(h => ({ ticker: h.ticker, cantidad: h.cantidad, cierre: h.cierre, vencimiento: h.vencimiento || null })),
    ajustes: data.ajustes || [], nav: data.navCierre || null, cuotapartes: data.cuotapartes || null,
  };
  const r = await fetch(`${SB_URL}/cierres_fondo?on_conflict=fund_id,fecha`, {
    method: 'POST',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(row),
  });
  if (!r.ok) throw new Error('cierres_fondo ' + r.status);
  if (state.atrib.fundId === fundId && state.atrib.cierres) {
    const l = state.atrib.cierres.filter(c => c.fecha !== fecha);
    l.push({ fecha, holdings: row.holdings, ajustes: row.ajustes, nav: row.nav });
    l.sort((a, b) => a.fecha.localeCompare(b.fecha));
    state.atrib.cierres = l;
  }
  return fecha;
}

function atribClave(fundId, ticker, grupo) {
  const meta = state.meta[fundId]?.[ticker];
  if (grupo === 'tipo')   return meta?.tipo || 'Otros';
  if (grupo === 'cat')    return meta?.categoria || 'Sin categoría';
  if (grupo === 'moneda') return meta?.moneda || 'ARS';
  const cc = (state.coveredCalls[fundId] || []).find(c => c.ticker_stock === ticker || c.ticker_call === ticker);
  if (cc) return cc.nombre || (cc.ticker_stock.split(' ')[0] + ' CC');
  return ticker;
}

// Un paso entre dos cierres (a → b)
function atribPaso(fundId, a, b, mepA, mepB) {
  const fondoMon = FUNDS_CONFIG[fundId]?.moneda || 'ARS';
  const meta  = state.meta[fundId] || {};
  const signo = t => SHORT_OPT_TIPOS.includes(meta[t]?.tipo) ? -1 : 1;
  const valido = h => meta[h.ticker]?.tipo !== 'Futuro de Dólar';
  const hA  = a.holdings.filter(valido);
  const mapB = new Map(b.holdings.map(h => [h.ticker, h]));
  const pnA = hA.reduce((s, h) => s + signo(h.ticker) * h.cantidad * h.cierre, 0)
            + (a.ajustes || []).reduce((s, x) => s + (+x.val || 0), 0);
  const items = [];
  if (!(pnA > 0)) return { R: 0, items, pnA };
  for (const h of hA) {
    const w  = signo(h.ticker) * h.cantidad * h.cierre / pnA;
    const hb = mapB.get(h.ticker);
    if (!hb || !(h.cierre > 0) || !(hb.cierre > 0)) { items.push({ ticker: h.ticker, w, r: null, precio: 0, fx: 0, sinDato: true }); continue; }
    const r = hb.cierre / h.cierre - 1;
    // Cauciones / MM: un salto > 1% entre cierres es renovación con otro capital, no rendimiento
    if (esLiquidez(meta[h.ticker]) && Math.abs(r) > 0.01) { items.push({ ticker: h.ticker, w, r: null, precio: 0, fx: 0, sinDato: true }); continue; }
    const mon = meta[h.ticker]?.moneda || fondoMon;
    let rfx = 0;
    if (mepA > 0 && mepB > 0) {
      if (fondoMon === 'USD' && mon === 'ARS') rfx = mepA / mepB - 1;
      else if (fondoMon === 'ARS' && mon === 'USD') rfx = mepB / mepA - 1;
    }
    items.push({ ticker: h.ticker, w, r, precio: w * (r - rfx), fx: w * rfx });
  }
  const expl = items.reduce((s, i) => s + i.precio + i.fx, 0);
  const R = a.nav > 0 && b.nav > 0 ? b.nav / a.nav - 1 : expl;
  return { R, items, pnA };
}

function atribAcumular(fundId, pasos, grupo) {
  const acc = new Map();
  let G = 1, resid = 0;
  for (const paso of pasos) {
    let expl = 0;
    for (const it of paso.items) {
      const k = atribClave(fundId, it.ticker, grupo);
      const e = acc.get(k) || { clave: k, precio: 0, fx: 0, wSum: 0, tickers: new Set(), crec: 1, sinDato: false, corto: it.w < 0 };
      e.precio += G * it.precio; e.fx += G * it.fx; e.wSum += it.w;
      e.tickers.add(it.ticker);
      if (it.r != null) e.crec *= (1 + it.r); else e.sinDato = true;
      acc.set(k, e);
      expl += it.precio + it.fx;
    }
    resid += G * (paso.R - expl);
    G *= (1 + paso.R);
  }
  const n = pasos.length || 1;
  const filas = [...acc.values()].map(e => ({
    clave: e.clave, precio: e.precio, fx: e.fx, total: e.precio + e.fx,
    peso: e.wSum / n,
    rend: e.tickers.size === 1 && !e.sinDato ? e.crec - 1 : null,
    sinDato: e.sinDato, corto: e.corto && e.tickers.size === 1,
  }));
  filas.sort((x, y) => y.total - x.total);
  return {
    filas, resid, total: G - 1,
    precio: filas.reduce((s, f) => s + f.precio, 0),
    fx: filas.reduce((s, f) => s + f.fx, 0),
  };
}

function atribCalcular(fundId) {
  const A = state.atrib;
  if (A.rango === 'HOY') {
    const cfg = FUNDS_CONFIG[fundId] || {};
    const moneda = cfg.moneda || 'ARS';
    const hold = state.holdings[fundId] || [];
    const meta = state.meta[fundId] || {};
    const a = { fecha: 'cierre', holdings: hold, ajustes: AJUSTES[fundId] || [], nav: cfg.navCierre };
    const b = { fecha: 'hoy', holdings: hold.map(h => {
      const m = meta[h.ticker];
      const { price } = calcPrecio(h, m, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
      return { ticker: h.ticker, cantidad: h.cantidad, cierre: price / (m?.lamina || 1) };
    }), nav: (cfg.navCierre || 0) * (1 + calcNAV(fundId).rend) };
    const paso = atribPaso(fundId, a, b, state.fxAyer, state.fxLive || state.fxAyer);
    return { ok: true, desde: fechaPDFaISO(cfg.pdfDate), hasta: null, pasos: 1, ...atribAcumular(fundId, [paso], A.grupo), live: true };
  }
  const cierres = cierresFondo(fundId);
  if (cierres.length < 2) return { ok: false, motivo: 'pocos', cierres };
  const ultimo = cierres[cierres.length - 1].fecha;
  let hasta = ultimo, desde;
  if (A.rango === 'CUSTOM') { hasta = A.hasta || ultimo; desde = A.desde || cierres[0].fecha; }
  else {
    const d = new Date(ultimo + 'T12:00:00');
    if (A.rango === '1S') d.setDate(d.getDate() - 7);
    else d.setMonth(d.getMonth() - (A.rango === '3M' ? 3 : 1));
    desde = isoLocal(d);
  }
  // Ajustar a cierres disponibles
  let iFin = -1, iIni = -1;
  cierres.forEach((c, i) => { if (c.fecha <= hasta) iFin = i; if (c.fecha <= desde) iIni = i; });
  if (iIni < 0) iIni = 0;
  if (iFin <= iIni) return { ok: false, motivo: 'rango', cierres, desde, hasta };
  const pasos = [];
  for (let i = iIni + 1; i <= iFin; i++) {
    const a = cierres[i - 1], b = cierres[i];
    pasos.push(atribPaso(fundId, a, b, mepAl(a.fecha), mepAl(b.fecha)));
  }
  const incompleto = desde < cierres[0].fecha;
  return { ok: true, desde: cierres[iIni].fecha, hasta: cierres[iFin].fecha, pasos: pasos.length, incompleto,
           ...atribAcumular(fundId, pasos, A.grupo) };
}

async function abrirAtribucion(fundId) {
  state.view = 'atrib';
  state.fundId = fundId;
  if (state.atrib.fundId !== fundId || !state.atrib.cierres) {
    state.atrib.fundId = fundId;
    state.atrib.cierres = null;
    state.atrib.loading = true;
    render();
    const [cierres, fx] = await Promise.all([cargarCierres(fundId), state.atrib.fx ? state.atrib.fx : cargarFxSerie()]);
    state.atrib.cierres = cierres;
    state.atrib.fx = fx;
    state.atrib.loading = false;
  }
  render();
}
function setAtrib(k, v) { state.atrib[k] = v; render(); }

}

  }

  // ── Formatos
  const pb  = v => (v > 0 ? '+' : v < 0 ? '−' : '') + _arN.format(Math.abs(Math.round(v * 100000) / 10)) + ' pb';
  const pct = v => v == null ? '—' : fPct(v);
  const col = v => v == null || Math.abs(v) < 5e-6 ? '#9A9AA0' : v > 0 ? '#2E9E2A' : '#D33A3F';
  const tile = (label, v, sub) => `
    <div style="min-width:150px">
      <div class="metric-label">${label}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;color:${col(v)}">${fPct(v)}</div>
      ${sub ? `<div style="font-size:11px;color:#5A5A60;margin-top:2px">${sub}</div>` : ''}
    </div>`;
  const periodo = res.live
    ? `Desde el cierre del ${res.desde ? fDiaHist(res.desde, true) : '—'} hasta ahora (precios en vivo)`
    : `${fDiaHist(res.desde, true)} → ${fDiaHist(res.hasta, true)} · ${res.pasos} ${res.pasos === 1 ? 'cierre' : 'cierres'}`;
  const residLabel = res.live ? 'Honorarios del día' : 'Honorarios, flujos y operaciones';

  // ── Barras divergentes (top 8 de cada lado + resto)
  const pos = res.filas.filter(f => f.total > 0), neg = res.filas.filter(f => f.total < 0).reverse();

  const restoNeg = neg.slice(8).reduce((s, f) => s + f.total, 0);
  const resto = restoPos + restoNeg;
  const bottom = neg.slice(0, 8).reverse();
  const barras = [...top, ...(Math.abs(resto) > 5e-7 ? [{ clave: 'Resto', total: resto, _resto: true }] : []), ...bottom];
  const maxAbs = Math.max(...barras.map(f => Math.abs(f.total)), 1e-9);
  const barRows = barras.map(f => {
    const w = Math.abs(f.total) / maxAbs * 50;
    const c = f.total >= 0 ? '#2E9E2A' : '#D33A3F';
    return `
      <div style="display:grid;grid-template-columns:150px 1fr 76px;align-items:center;gap:10px;margin-bottom:6px" title="${f.clave}: ${pb(f.total)}">

          <div style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,0.15)"></div>

                      ${f.total >= 0 ? 'left:50%' : 'right:50%'};width:${w}%"></div>
        </div>
        <div style="text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#E5E5E7">${pb(f.total)}</div>
      </div>`;
  }).join('');

  // ── Tabla
  const showFx = Math.abs(res.fx) > 1e-7 || res.filas.some(f => Math.abs(f.fx) > 1e-7);
  const filasHtml = res.filas.map(f => `
    <tr>
      <td>${A.grupo === 'activo' ? `<span class="ticker-chip">${f.clave}</span>` : f.clave}${f.sinDato ? `<span style="font-size:10px;color:#F59E0B;display:block;margin-top:2px">sin precio en algún cierre</span>` : ''}</td>
      <td class="num">${f2(f.peso * 100)}%</td>
      <td class="num" style="color:${col(f.rend == null ? null : f.corto ? -f.rend : f.rend)}">${pct(f.rend)}${f.corto ? '<span style="font-size:10px;color:#5A5A60;display:block;margin-top:2px">posición vendida</span>' : ''}</td>
      <td class="num" style="color:${col(f.precio)}">${pb(f.precio)}</td>
      ${showFx ? `<td class="num" style="color:${col(f.fx)}">${pb(f.fx)}</td>` : ''}
      <td class="num" style="font-weight:700;color:${col(f.total)}">${pb(f.total)}</td>
      <td class="num" style="color:#9A9AA0">${fPct(f.total)}</td>
    </tr>`).join('');

  return head + controles + `
    <div style="background:#161618;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 20px;margin-bottom:16px">
      <div style="font-size:12px;color:#9A9AA0;margin-bottom:14px">${periodo}${res.incompleto ? ' · <span style="color:#F59E0B">no hay cierres guardados desde el inicio del período pedido</span>' : ''}</div>
      <div style="display:flex;gap:28px;flex-wrap:wrap">
        ${tile(res.live ? 'Rendimiento en vivo' : 'Rendimiento del período', res.total, res.live ? 'valor cuotaparte vivo vs. cierre' : 'según valor cuotaparte de los PDFs')}
        ${tile('Efecto precio', res.precio, 'suma de contribuciones por precio')}
        ${showFx ? tile('Efecto tipo de cambio', res.fx, 'variación del MEP en activos de otra moneda') : ''}
        ${tile(residLabel, res.resid, res.live ? '' : 'diferencia vs. el rendimiento oficial')}
      </div>
    </div>
    <div style="background:#161618;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;color:#5A5A60;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px">Contribución al rendimiento · puntos básicos</div>
      ${barRows || '<div style="color:#5A5A60;font-size:13px">Sin movimientos en el período.</div>'}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>${ATRIB_GRUPOS.find(g => g[0] === A.grupo)[1]}</th><th class="num">Peso prom.</th><th class="num">Rend. del activo</th>
          <th class="num">Precio</th>${showFx ? '<th class="num">Tipo de cambio</th>' : ''}<th class="num">Contribución</th><th class="num">%</th>
        </tr></thead>
        <tbody>${filasHtml}
          <tr><td colspan="${showFx ? 5 : 4}" class="denom-cell">${residLabel}</td>
              <td class="num" style="font-weight:700;color:${col(res.resid)}">${pb(res.resid)}</td><td class="num" style="color:#9A9AA0">${fPct(res.resid)}</td></tr>
        </tbody>
        <tfoot><tr style="border-top:1px solid rgba(255,255,255,0.12);font-weight:800">
          <td colspan="${showFx ? 5 : 4}">Total</td>
          <td class="num" style="color:${col(res.total)}">${pb(res.total)}</td><td class="num" style="color:${col(res.total)}">${fPct(res.total)}</td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
}

// ── Carga masiva de PDFs anteriores (solo guarda cierres + historial de VCP;
//    NO toca la cartera actual) ─────────────────────────────────────────
async function cargarPDFsHistoricos(files) {
  const fundId = state.fundId;
  const lista = [...(files || [])];
  document.getElementById('pdf-hist-input').value = '';
  if (!lista.length || !fundId) return;
  const actuales = new Set((state.holdings[fundId] || []).map(h => h.ticker));
  const resultados = [];
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    showModal(`<div class="modal-box" style="max-width:380px;padding:36px;text-align:center">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <div style="color:#9A9AA0;font-size:14px;font-weight:600">Procesando ${i + 1} de ${lista.length}</div>
      <div style="color:#5A5A60;font-size:12px;margin-top:6px">${f.name}</div>
    </div>`);
    try {
      const data = await parsePDF(await f.arrayBuffer());
      if (!data.holdings.length) throw new Error('sin inversiones');
      const fecha = await guardarCierre(fundId, data);
      let vcpOk = false;
      const vh = prepararVcpHistorial(fundId, data);
      if (vh.escalaOk && vh.vcp > 0 && vh.fecha) {
        // Si ya hay un valor para esa fecha (ej. del Excel) no se pisa
        const r = await fetch(`${SB_URL}/vcp_historial?on_conflict=fund_id,fecha,clase`, {
          method: 'POST',
          headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
          body: JSON.stringify({ fund_id: fundId, fecha: vh.fecha, clase: 'A', vcp: vh.vcp, fuente: 'pdf' }),
        });
        vcpOk = r.ok;
      }
      const coincid = actuales.size ? data.holdings.filter(h => actuales.has(h.ticker)).length / data.holdings.length : 1;
      resultados.push({ archivo: f.name, fecha, n: data.holdings.length, ok: true, vcpOk, aviso: coincid < 0.3 ? '¿Es de este fondo? Casi no coincide con la cartera actual' : '' });
    } catch (e) {
      resultados.push({ archivo: f.name, ok: false, error: e.message });
    }
  }
  state.historial = await cargarHistorial();
  resultados.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  const dup = new Set(resultados.filter((r, i, arr) => r.fecha && arr.findIndex(x => x.fecha === r.fecha) !== i).map(r => r.fecha));
  const filas = resultados.map(r => `
    <tr>
      <td style="padding:6px 10px;font-size:12px;color:#9A9AA0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.archivo}</td>
      <td style="padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px">${r.fecha ? fDiaHist(r.fecha, true) : '—'}</td>
      <td style="padding:6px 10px;text-align:right;font-size:12px">${r.n ?? '—'}</td>
      <td style="padding:6px 10px;font-size:12px;color:${r.ok && !r.aviso && !dup.has(r.fecha) ? '#2E9E2A' : '#F59E0B'}">
        ${!r.ok ? 'Error: ' + r.error : dup.has(r.fecha) ? 'Fecha repetida: quedó el último' : r.aviso || 'OK'}</td>
    </tr>`).join('');
  showModal(`
    <div class="modal-box" style="max-width:620px">
      <div class="modal-header"><div style="font-size:16px;font-weight:800">PDFs anteriores cargados</div>
        <button onclick="closeModal();render()" style="background:none;border:none;color:#9A9AA0;cursor:pointer;font-size:18px">✕</button></div>
      <div class="modal-body">
        <p style="color:#9A9AA0;font-size:13px;margin-bottom:12px">${resultados.filter(r => r.ok).length} de ${resultados.length} guardados como cierres. La cartera actual no se modificó.</p>
        <div style="max-height:340px;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:8px">
          <table style="width:100%;border-collapse:collapse"><thead><tr>
            <th style="padding:8px 10px;text-align:left;font-size:10px;color:#5A5A60">ARCHIVO</th>
            <th style="padding:8px 10px;text-align:left;font-size:10px;color:#5A5A60">FECHA</th>
            <th style="padding:8px 10px;text-align:right;font-size:10px;color:#5A5A60">ACTIVOS</th>
            <th style="padding:8px 10px;text-align:left;font-size:10px;color:#5A5A60">ESTADO</th>
          </tr></thead><tbody>${filas}</tbody></table>
        </div>
      </div>
      <div class="modal-footer"><button class="btn-primary" onclick="closeModal();render()">Listo</button></div>
    </div>`);
}

// ── FONDO DETALLE ────────────────────────────────────────────────────
function renderFondo(fundId) {
  const cfg = FUNDS_CONFIG[fundId];
  if (!cfg) return `<div class="center-msg"><span>Fondo no encontrado</span></div>`;
  const { navLive, rend, pn, totalInv, ajusteSum, honorario } = calcNAV(fundId);
  const holdings  = state.holdings[fundId] || [];
  const fondoMeta = state.meta[fundId] || {};
  const moneda    = cfg.moneda || 'ARS';
  const pos = rend >= 5e-5, neg = rend <= -5e-5;
  const rendColor = pos ? '#A6E635' : (neg ? '#D33A3F' : '#9A9AA0');
  const enHorario = dentroHorarioMercado();

  // ── Holdings rows ────────────────────────────────────────────────
  const tiposUnicos  = [...new Set(holdings.map(h => fondoMeta[h.ticker]?.tipo).filter(Boolean))].sort();
  const catsUnicas   = [...new Set(holdings.map(h => fondoMeta[h.ticker]?.categoria).filter(Boolean))].sort();
  const montosAjust  = calcMontosCartera(fundId); // mapa ticker → montoDisplay
  const montosMap      = Object.fromEntries(montosAjust.map(i => [i.ticker, i.montoDisplay]));
  const montosTablaMap = Object.fromEntries(montosAjust.map(i => [i.ticker, i.montoTabla]));
  const reservaMap     = Object.fromEntries(montosAjust.map(i => [i.ticker, i.reservado || 0]));
  const ccNotionalMap  = Object.fromEntries(montosAjust.filter(i => i._isCoveredCall).map(i => [i.ticker, i.notional || 0]));
  const subNota = txt => `<span style="font-size:10px;color:#5A5A60;display:block;margin-top:2px">${txt}</span>`;

  // Covered Call lookups
  const ccList    = state.coveredCalls[fundId] || [];
  const ccByStock = new Map(ccList.map(cc => [cc.ticker_stock, cc]));
  const ccCallSet = new Set(ccList.map(cc => cc.ticker_call));

  const rows = holdings.map(h => {
    // ── Fila oculta: call dentro de un CC pair ───────────────────
    if (ccCallSet.has(h.ticker)) return '';

    const meta   = fondoMeta[h.ticker];
    const instrMoneda = meta?.moneda || 'ARS';
    const { price, live } = calcPrecio(h, meta, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
    const lamina  = meta?.lamina || 1;
    const cierre  = h.cierre * lamina;
    const monto   = h.cantidad * (price / lamina);
    const tipo    = meta?.tipo   || 'Otros';
    const isShortCall = SHORT_OPT_TIPOS.includes(tipo);
    const priceDisplay = live ? price : cierre;
    const varPct  = live && cierre > 0
      ? (isShortCall ? cierre / price - 1 : price / cierre - 1)
      : 0;
    const cat     = meta?.categoria || '';
    const precioInicial = meta?.precioInicial ?? null;
    const varHist = precioInicial > 0
      ? (isShortCall ? precioInicial / priceDisplay - 1 : priceDisplay / precioInicial - 1)
      : null;
    const varHistColor = varHist === null ? '#9A9AA0'
      : Math.abs(varHist) < 1e-9  ? '#9A9AA0'
      : varHist > 0               ? '#2E9E2A' : '#D33A3F';
    const montoDisplay = montosMap[h.ticker]     ?? monto;
    const montoTabla   = montosTablaMap[h.ticker] ?? monto;
    const varColor = Math.abs(varPct) < 1e-9 ? '#9A9AA0' : (varPct > 0 ? '#2E9E2A' : '#D33A3F');
    const badge   = live
      ? `<span class="badge badge-live">LIVE</span>`
      : `<span class="badge badge-hold">CIERRE</span>`;
    const monedaBg    = instrMoneda === 'USD' ? '#ECFCCB' : '#EDE9FE';
    const monedaColor = instrMoneda === 'USD' ? '#3F6212' : '#5B21B6';

    // ── Fila combinada: stock dentro de un CC pair ───────────────
    if (ccByStock.has(h.ticker)) {
      const cc      = ccByStock.get(h.ticker);
      const h_call  = holdings.find(hh => hh.ticker === cc.ticker_call);
      const m_call  = fondoMeta[cc.ticker_call];
      const ccNombre = cc.nombre || (h.ticker.split(' ')[0] + ' CC');
      const ccCat    = cat || 'Covered Call';

      // Cantidades
      const pairedQty   = h_call ? h_call.cantidad : h.cantidad;
      const residualQty = h.cantidad - pairedQty;
      const priceUnit   = lamina > 0 ? priceDisplay / lamina : 0;
      const cierreUnit  = lamina > 0 ? cierre / lamina : 0;

      // Monto neto del CC
      let callMonto = 0, callPriceStr = '';
      if (h_call && m_call) {
        const { price: cp } = calcPrecio(h_call, m_call, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
        const cl = m_call.lamina || 1;
        callMonto = h_call.cantidad * (cp / cl);
        callPriceStr = f2(cp);
      }
      const ccStockMonto = pairedQty * priceUnit;
      const netMonto     = ccStockMonto - Math.abs(callMonto);
      const ccNotional   = ccNotionalMap[h.ticker] || 0;
      const netPct       = pn > 0 ? ((netMonto + ccNotional) / pn * 100).toFixed(2) + '%' : '—';

      const dissolveBtn = `<button onclick="eliminarCoveredCall(${cc.id})"
        title="Disolver Covered Call"
        style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);color:#818CF8;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">✕</button>`;

      const ccRow = `
      <tr class="holding-row" data-ticker="${ccNombre.toLowerCase()}" data-tipo="Covered Call" data-cat="${ccCat}">
        <td><span class="ticker-chip" style="background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);color:#818CF8">${ccNombre}</span></td>
        <td class="denom-cell">
          ${meta?.denom || h.ticker}
          <span style="font-size:10px;color:#5A5A60;display:block;margin-top:2px">✕ ${cc.ticker_call}${callPriceStr ? ' · call @ ' + callPriceStr : ''}${residualQty > 0 ? ' · ' + fNum(pairedQty) + ' cubiertos' : ''}</span>
        </td>
        <td class="num">${fNum(pairedQty)}</td>
        <td class="num">${f2(cierreUnit)}</td>
        <td class="num">${f2(priceDisplay)} ${badge}</td>
        <td class="num" style="color:${varColor}">${fPct(varPct)}</td>
        <td class="num" style="color:${varHistColor}">${varHist !== null ? fPct(varHist) : '—'}</td>
        <td class="num">${fARS(netMonto)}${ccNotional > 0 ? subNota('exposición ' + fARS(netMonto + ccNotional)) : ''}</td>
        <td class="num" style="color:#9A9AA0">${netPct}</td>
        <td>${dissolveBtn}</td>
      </tr>`;

      // Fila residual si hay nominales sin cubrir
      const residualRow = residualQty > 0 ? `
      <tr class="holding-row" data-ticker="${h.ticker.toLowerCase()}_resid" data-tipo="${tipo}" data-cat="${cat}">
        <td><span class="ticker-chip">${h.ticker}</span></td>
        <td class="denom-cell">
          ${meta?.denom || h.ticker}
          <span style="font-size:10px;color:#5A5A60;display:block;margin-top:2px">sin cubrir</span>
        </td>
        <td class="num">${fNum(residualQty)}</td>
        <td class="num">${f2(cierreUnit)}</td>
        <td class="num">${f2(priceDisplay)} ${badge}</td>
        <td class="num" style="color:${varColor}">${fPct(varPct)}</td>
        <td class="num" style="color:${varHistColor}">${varHist !== null ? fPct(varHist) : '—'}</td>
        <td class="num">${fARS(residualQty * priceUnit)}</td>
        <td class="num" style="color:#9A9AA0">${pn > 0 ? (residualQty * priceUnit / pn * 100).toFixed(2) + '%' : '—'}</td>
        <td></td>
      </tr>` : '';

      return ccRow + residualRow;
    }

    return `
      <tr class="holding-row" data-ticker="${h.ticker.toLowerCase()}" data-tipo="${tipo}" data-cat="${cat}">
        <td><span class="ticker-chip">${h.ticker}</span></td>
        <td class="denom-cell">${meta?.denom || h.ticker}</td>
        <td class="num">${fNum(h.cantidad)}</td>
        <td class="num">${f2(cierre)}</td>
        <td class="num">${f2(priceDisplay)} ${badge}</td>
        <td class="num" style="color:${varColor}">${fPct(varPct)}</td>
        <td class="num" style="color:${varHistColor}">${varHist !== null ? fPct(varHist) : '—'}${
          precioInicial > 0 ? `<span style="font-size:10px;display:block;margin-top:2px;font-family:'JetBrains Mono',monospace">${fARS((isShortCall ? -1 : 1) * h.cantidad * (priceDisplay - precioInicial) / lamina)}</span>` : ''}</td>
        <td class="num">${fARS(montoTabla)}${
          SHORT_OPT_TIPOS.includes(tipo) && Math.abs(montoDisplay - montoTabla) > 0.5
            ? subNota('exposición ' + fARS(montoDisplay))
            : (reservaMap[h.ticker] > 0.5
                ? subNota('<span style="color:#D33A3F">reservado ' + fARS(-reservaMap[h.ticker]) + '</span> · libre ' + fARS(montoDisplay))
                : '')
        }</td>
        <td class="num" style="color:#9A9AA0">${pn > 0 ? (montoDisplay / pn * 100).toFixed(2) + '%' : '—'}</td>
        <td><span class="moneda-badge" style="background:${monedaBg};color:${monedaColor}">${instrMoneda}</span></td>
      </tr>`;
  }).join('');

  // ── Ajustes rows ─────────────────────────────────────────────────
  const ajusteRows = (AJUSTES[fundId] || []).map(a => `
    <tr>
      <td colspan="7" class="denom-cell">${a.label}</td>
      <td class="num" style="color:${a.val >= 0 ? '#9A9AA0' : '#D33A3F'}">${fARS(a.val)}</td>
      <td></td>
    </tr>`).join('');

  // PNIZF ya incluye honorarios en sus ajustes del PDF → no mostrar el calculado
  const honorarioRow = fundId === 'PNIZF' ? '' : `
    <tr>
      <td colspan="7" class="denom-cell">(−) Honorarios devengados (1 día)</td>
      <td class="num" style="color:#D33A3F">${fARS(-honorario)}</td>
      <td></td>
    </tr>`;

  return `
    ${renderTopBar({ showBack: true })}
    <div class="fund-page">
      <div class="fund-hero" style="--accent:${cfg.color}">
        <div class="fund-hero-name">${cfg.nombre}</div>
        <div class="fund-hero-metrics">
          <div>
            <div class="metric-label">NAV live</div>
            <div class="metric-value lg">${f4(navLive)}</div>
          </div>
          <div>
            <div class="metric-label">NAV cierre</div>
            <div class="metric-value">${f4(cfg.navCierre)}</div>
          </div>
          <div>
            <div class="metric-label">Rendimiento</div>
            <div class="metric-value" style="color:${rendColor}">${fPct(rend)}</div>
          </div>
          <div>
            <div class="metric-label">PN live</div>
            <div class="metric-value">${fARS(pn)}</div>
          </div>
          <div>
            <div class="metric-label">Cuotapartes</div>
            <div class="metric-value">${fNum(cfg.cuotapartes)}</div>
          </div>
        </div>
      </div>

      ${renderTabs(fundId, 'fund')}
      ${renderHistorial(fundId)}
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <!-- Breakdown buttons -->
        <div style="display:flex;gap:6px">
          ${['moneda','tipo','cat'].map((m, i) => {
            const label = ['Moneda','Tipo de Activo','Categoría'][i];
            const active = state.breakdown === m;
            return `<button onclick="toggleBreakdown('${m}')"
              style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.15s;
                     background:${active ? 'rgba(166,230,53,0.15)' : 'rgba(255,255,255,0.05)'};
                     border:1px solid ${active ? 'rgba(166,230,53,0.4)' : 'rgba(255,255,255,0.08)'};
                     color:${active ? '#A6E635' : '#9A9AA0'}">${label}</button>`;
          }).join('')}
        </div>
        <!-- Right side buttons -->
        <div style="display:flex;gap:10px;align-items:center">
        <button data-action="activos" data-id="${fundId}" class="upload-btn" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="15" x2="12" y2="15"/></svg>
          Activos
        </button>
        <button ${enHorario && !state.updatingPrices ? 'onclick="actualizarPrecios()"' : 'disabled'} class="upload-btn"
          title="${enHorario ? 'Actualizar precios ahora' : 'Actualización disponible de lunes a viernes de 9:00 a 17:20'}"

          ${state.updatingPrices ? 'Actualizando…' : (enHorario ? 'Actualizar precios' : 'Fuera de horario (9:00–17:20)')}
          ${state.lastPriceUpdate ? `<span style="font-size:10px;opacity:0.5;margin-left:4px">${state.lastPriceUpdate.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'})}</span>` : ''}
        </button>

// ── FILTRO DE HOLDINGS ───────────────────────────────────────────────
function filtrarHoldings() {
  const ticker = (document.getElementById('flt-ticker')?.value || '').toLowerCase().trim();
  const tipo   = document.getElementById('flt-tipo')?.value  || '';
  const cat    = document.getElementById('flt-cat')?.value   || '';
  document.querySelectorAll('tr.holding-row').forEach(tr => {
    const okTicker = !ticker || tr.dataset.ticker.includes(ticker);
    const okTipo   = !tipo   || tr.dataset.tipo === tipo;
    const okCat    = !cat    || tr.dataset.cat  === cat;
    tr.style.display = (okTicker && okTipo && okCat) ? '' : 'none';
  });
}

// ── EVENTOS ──────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'fondo') {
        state.view      = 'fund';
        state.fundId    = el.dataset.id;
        state.breakdown = null;
        render();
      } else if (action === 'landing') {
        state.view = 'landing';
        render();
      } else if (action === 'activos') {
        state.view   = 'activos';
        state.fundId = el.dataset.id || state.fundId;
        render();
      } else if (action === 'atrib') {
        abrirAtribucion(el.dataset.id || state.fundId);
      } else if (action === 'fund') {
        state.view = 'fund';
        render();
      }
    });
  });
}

async function cargarCoveredCalls() {
  try {
    const rows = await sbGet('/covered_calls?select=id,fund_id,ticker_stock,ticker_call,nombre&order=id.asc');
    state.coveredCalls = {};
    for (const r of rows) {
      if (!state.coveredCalls[r.fund_id]) state.coveredCalls[r.fund_id] = [];
      state.coveredCalls[r.fund_id].push(r);
    }
  } catch(e) {
    console.warn('[iEB] covered_calls no disponible:', e.message);
    state.coveredCalls = {};
  }
}

async function guardarCoveredCall(fundId, tickerStock, tickerCall, nombre) {
  const body = JSON.stringify({ fund_id: fundId, ticker_stock: tickerStock, ticker_call: tickerCall, nombre });
  const r = await fetch(SB_URL + '/covered_calls', {
    method: 'POST',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body,
  });
  const [saved] = await r.json();
  if (!state.coveredCalls[fundId]) state.coveredCalls[fundId] = [];
  state.coveredCalls[fundId].push(saved);
  closeModal();
  render();
}

async function eliminarCoveredCall(id) {
  if (!confirm('¿Disolver este Covered Call? Los activos volverán a mostrarse por separado.')) return;
  await fetch(SB_URL + '/covered_calls?id=eq.' + id, { method: 'DELETE', headers: SB_HDR });
  for (const fid of Object.keys(state.coveredCalls)) {
    state.coveredCalls[fid] = state.coveredCalls[fid].filter(cc => cc.id !== id);
  }
  render();
}

// ONE PAGE — genera el informe de composición en una ventana imprimible
// ═══════════════════════════════════════════════════════════════════
function generarOnePage(fundId) {
  const cfg = FUNDS_CONFIG[fundId];
  if (!cfg) return;

  const holdings    = state.holdings[fundId] || [];
  const fondoMeta   = state.meta[fundId]     || {};
  const monedaFondo = cfg.moneda || 'USD';
  const ccList      = state.coveredCalls[fundId] || [];
  const ccByStock   = new Map(ccList.map(cc => [cc.ticker_stock, cc]));
  const ccCallSet   = new Set(ccList.map(cc => cc.ticker_call));

  const { pn } = calcNAV(fundId);
  const montosItems = calcMontosCartera(fundId);
  const montosMap   = Object.fromEntries(montosItems.map(i => [i.ticker, i.montoDisplay]));

  // ── Collect per-holding data ────────────────────────────────────
  const items = [];
  for (const h of holdings) {
    if (ccCallSet.has(h.ticker)) continue;
    const meta      = fondoMeta[h.ticker];
    const { price, live } = calcPrecio(h, meta, monedaFondo, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
    const lamina    = meta?.lamina || 1;
    const cierre    = h.cierre * lamina;
    const tipo      = meta?.tipo  || 'Otros';
    const cat       = meta?.categoria || 'Sin categoría';
    const instrMoneda = meta?.moneda || monedaFondo;
    const isShort   = SHORT_OPT_TIPOS.includes(tipo);
    const priceDisp = live ? price : cierre;
    const varPct    = live && cierre > 0 ? (isShort ? cierre/price - 1 : price/cierre - 1) : null;
    const pi        = meta?.precioInicial ?? null;
    const varHist   = pi > 0 ? (isShort ? pi/priceDisp - 1 : priceDisp/pi - 1) : null;
    const monto     = montosMap[h.ticker] ?? h.cantidad * (price / lamina);

    let dispTicker = h.ticker, dispCat = cat;
    if (ccByStock.has(h.ticker)) {
      const cc = ccByStock.get(h.ticker);
      dispTicker = cc.nombre || (h.ticker + ' CC');
      dispCat    = 'Covered Call';
    }
    items.push({ ticker: dispTicker, tipo, cat: dispCat, instrMoneda, monto, varPct, varHist });
  }

  // ── Aggregations ────────────────────────────────────────────────
  const byCategoria = {};
  for (const it of items) {
    if (!byCategoria[it.cat]) byCategoria[it.cat] = { total: 0, items: [] };
    byCategoria[it.cat].total += it.monto;
    byCategoria[it.cat].items.push(it);
  }
  const cats = Object.entries(byCategoria).sort((a, b) => b[1].total - a[1].total);

  const byMoneda = {};
  for (const it of items) { byMoneda[it.instrMoneda] = (byMoneda[it.instrMoneda] || 0) + it.monto; }
  const totalMoneda = Object.values(byMoneda).reduce((s, v) => s + v, 0);

  const GRUPO_MAP = {
    'Soberano HD':'Bonos','Soberano DL':'Bonos','Soberanos ARS':'Bonos',
    'ON Corporativa HD':'Bonos','ON DL':'Bonos','ON HD':'Bonos',
    'Pagaré':'Bonos','Pagaré USD':'Bonos','Pagaré ARS':'Bonos',
    'Equity USA':'Equity','Equity Argentina':'Equity','Cedear':'Equity',
    'Covered Call':'Covered Call','Venta Call':'Covered Call','Compra Call':'Covered Call',
    'Venta Put':'Puts','Compra Put':'Puts','Liquidez':'Liquidez',
    'Money market USD':'Liquidez','Money market ARS':'Liquidez','Cash Cable':'Liquidez',
    'Commodities':'Commodities',
    'Short Equity':'Short Equity',
    'Short Bonos':'Short Bonos','Short Renta Fija':'Short Bonos',
  };
  const GRUPO_COLORS = {
    'Bonos':'#86EFAC','Equity':'#A78BFA','Covered Call':'#F472B6',
    'Liquidez':'#FCD34D','Commodities':'#2DD4BF','Puts':'#FB7185',
    'Short Equity':'#FB923C','Short Bonos':'#94A3B8','Otros':'#64748B',
  };

  const byGrupo = {};
  for (const it of items) {
    const g = GRUPO_MAP[it.cat] || 'Otros';
    byGrupo[g] = (byGrupo[g] || 0) + it.monto;
  }
  const gruposSorted = Object.entries(byGrupo).sort((a, b) => b[1] - a[1]);

  // ── Format helpers ───────────────────────────────────────────────
  const fPctSigned = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
  const nowDate    = new Date();
  const fechaStr   = nowDate.toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' });
  const aumStr     = (monedaFondo === 'USD' ? 'USD ' : '$ ') +
                     pn.toLocaleString('es-AR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  const gColor = g => GRUPO_COLORS[g] || '#64748B';
  const catColor = cat => gColor(GRUPO_MAP[cat] || 'Otros');

  // ── Build HTML sections ──────────────────────────────────────────
  // Stacked bar
  const barSegments = gruposSorted.map(([g, v]) => {
    const pct = pn > 0 ? v / pn * 100 : 0;
    return '<div style="flex:' + pct + ';background:' + gColor(g) + ';height:100%;min-width:' + (pct > 0.5 ? '2px' : '0') + '" title="' + g + ': ' + pct.toFixed(2) + '%"></div>';
  }).join('');

  const barLegend = gruposSorted.map(([g, v]) => {
    const pct = pn > 0 ? v / pn * 100 : 0;
    return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#C8C8CC;margin-right:14px;margin-bottom:5px">'
      + '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + gColor(g) + '"></span>'
      + '<span>' + g + '</span>'
      + '<span style="color:#6B7280">' + pct.toFixed(2) + '%</span></span>';
  }).join('');

  // Currency rows
  const monedaRows = Object.entries(byMoneda).sort((a,b)=>b[1]-a[1]).map(([m, v]) => {
    const pct = totalMoneda > 0 ? v / totalMoneda * 100 : 0;
    const dot = m === 'USD' ? '#A6E635' : '#818CF8';
    return '<tr>'
      + '<td style="padding:5px 0;display:flex;align-items:center;gap:6px">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + dot + '"></span>'
      + '<span style="font-size:12px;font-weight:500">' + m + '</span></td>'
      + '<td style="padding:5px 0 5px 16px;text-align:right;font-size:12px;font-weight:700">' + pct.toFixed(2) + '%</td>'
      + '</tr>';
  }).join('');

  // Category summary (two-column via CSS columns)
  const maxCatM = cats.length > 0 ? cats[0][1].total : 1;
  const summaryRows = cats.map(([cat, data]) => {
    const pct  = pn > 0 ? data.total / pn * 100 : 0;
    const barW = Math.max(0, Math.min(100, data.total / maxCatM * 100));
    const col  = catColor(cat);
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;break-inside:avoid">'
      + '<div style="width:120px;font-size:11px;color:#C8C8CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + cat + '</div>'
      + '<div style="flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">'
      + '<div style="width:' + barW + '%;height:100%;background:' + col + ';border-radius:3px"></div></div>'
      + '<div style="width:48px;text-align:right;font-size:11px;font-weight:700;color:#E5E5E7">' + pct.toFixed(2) + '%</div>'
      + '</div>';
  }).join('');

  // Detail columns
  // Balance columns by item count, not category count
  const totalH = cats.reduce((s, [, d]) => s + d.items.length + 2, 0);
  const target = totalH / 3;
  const colData = [[], [], []];
  let ci = 0, ch = 0;
  for (const entry of cats) {
    const h = entry[1].items.length + 2;
    if (ci < 2 && ch + h * 0.5 > target) { ci++; ch = 0; }
    colData[ci].push(entry);
    ch += h;
  }

  const renderCol = (col) => col.map(([cat, data]) => {
    const catPct = pn > 0 ? data.total / pn * 100 : 0;
    const col2   = catColor(cat);
    const hdrRow = '<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.08)">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + col2 + ';flex-shrink:0"></span>'
      + '<span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;color:#E5E5E7;flex:1">' + cat + '</span>'
      + '<span style="font-size:10px;font-weight:700;color:#E5E5E7">' + catPct.toFixed(2) + '%</span></div>';

    const actRows = data.items.map(it => {
      const pnP = pn > 0 ? it.monto / pn * 100 : 0;
      const dC  = it.varPct  === null ? '#6B7280' : it.varPct  > 1e-4 ? '#4ADE80' : it.varPct  < -1e-4 ? '#F87171' : '#6B7280';
      const hC  = it.varHist === null ? '#6B7280' : it.varHist > 1e-4 ? '#4ADE80' : it.varHist < -1e-4 ? '#F87171' : '#6B7280';
      const dS  = it.varPct  !== null ? fPctSigned(it.varPct)  : '—';
      const hS  = it.varHist !== null ? fPctSigned(it.varHist) : '—';
      return '<tr style="border-bottom:1px solid rgba(255,255,255,0.04)">'
        + '<td style="padding:3px 0;font-size:10.5px;color:#E5E5E7;font-weight:500">' + it.ticker + '</td>'
        + '<td style="padding:3px 4px;font-size:10.5px;text-align:right;color:#9A9AA0">' + pnP.toFixed(2) + '%</td>'
        + '<td style="padding:3px 0 3px 4px;font-size:10.5px;text-align:right;color:' + dC + '">' + dS + '</td>'
        + '<td style="padding:3px 0 3px 4px;font-size:10.5px;text-align:right;color:' + hC + '">' + hS + '</td>'
        + '</tr>';
    }).join('');

    return '<div style="margin-bottom:16px;break-inside:avoid">' + hdrRow
      + '<table style="width:100%;border-collapse:collapse">'
      + '<thead><tr>'
      + '<th style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#4B5563;text-align:left;padding-bottom:3px">ACTIVO</th>'
      + '<th style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#4B5563;text-align:right;padding-bottom:3px">% PN</th>'
      + '<th style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#4B5563;text-align:right;padding-bottom:3px">DÍA</th>'
      + '<th style="font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#4B5563;text-align:right;padding-bottom:3px">HIST</th>'
      + '</tr></thead><tbody>' + actRows + '</tbody></table></div>';
  }).join('');

  const col1H = renderCol(colData[0]);
  const col2H = renderCol(colData[1]);
  const col3H = renderCol(colData[2]);

  // ── Full HTML ────────────────────────────────────────────────────
  const html = '<!DOCTYPE html><html lang="es"><head>'
    + '<meta charset="UTF-8">'
    + '<title>' + cfg.nombre + ' — Composición de Cartera</title>'
    + '<style>'
    + "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');"
    + '* { margin:0; padding:0; box-sizing:border-box; }'
    + 'body { font-family:\'Inter\',sans-serif; background:#0B0B0F; color:#FFF; padding:24px 28px; }'
    + '@media print {'
    + '  body { padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }'
    + '  @page { size:A4 portrait; margin:10mm 12mm; }'
    + '}'
    + '</style></head><body>'

    // Header
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">'
    + '<div style="display:flex;align-items:center;gap:9px">'
    + '<div style="width:26px;height:26px;border-radius:5px;background:' + cfg.color + ';flex-shrink:0"></div>'
    + '<div><div style="font-size:13px;font-weight:800">' + cfg.nombre + '</div>'
    + '<div style="font-size:10px;color:#6B7280">Asset Management</div></div></div>'
    + '<div style="display:flex;align-items:center;gap:12px">'
    + '<div style="padding:3px 10px;border-radius:100px;border:1px solid #A6E635;color:#A6E635;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px">Composición de Cartera</div>'
    + '<div style="font-size:11px;color:#6B7280">' + fechaStr + '</div>'
    + '</div></div>'

    // Subtitle
    + '<div style="font-size:9.5px;color:#6B7280;letter-spacing:0.4px;margin-bottom:4px">● RETORNO TOTAL · MULTIACTIVO · ' + (monedaFondo === 'USD' ? 'DÓLARES' : 'PESOS') + '</div>'

    // Title + AUM
    + '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px">'
    + '<div style="font-size:30px;font-weight:900;letter-spacing:-0.5px">Composición de cartera</div>'
    + '<div style="text-align:right">'
    + '<div style="font-size:9px;color:#6B7280;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:1px">AUM</div>'
    + '<div style="font-size:22px;font-weight:900;letter-spacing:-0.3px">' + aumStr + '</div>'
    + '</div></div>'
    + '<div style="font-size:10px;color:#4B5563;margin-bottom:20px">FCI ' + cfg.nombre + ' · porcentajes sobre Patrimonio Neto · Benchmark T-Bill USD</div>'

    // Bar + currency (side by side)
    + '<div style="display:flex;gap:20px;margin-bottom:20px;align-items:flex-start">'
    + '<div style="flex:1">'
    + '<div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:#9A9AA0;margin-bottom:8px">■ Distribución por Tipo de Activo</div>'

let _xlsxPromise = null;
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxPromise) return _xlsxPromise;
  _xlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload  = () => resolve();
    s.onerror = () => { _xlsxPromise = null; reject(new Error('No se pudo cargar la librería de Excel')); };
    document.head.appendChild(s);
  });
  return _xlsxPromise;
}

// Misma lógica de filas que la tabla del fondo (incl. Covered Calls), en valores numéricos
function calcFilasExport(fundId) {
  const cfg = FUNDS_CONFIG[fundId];
  if (!cfg) return null;
  const { navLive, rend, pn, totalInv, honorario } = calcNAV(fundId);
  const holdings  = state.holdings[fundId] || [];
  const fondoMeta = state.meta[fundId] || {};
  const moneda    = cfg.moneda || 'ARS';

  const montosAjust    = calcMontosCartera(fundId);
  const montosMap      = Object.fromEntries(montosAjust.map(i => [i.ticker, i.montoDisplay]));
  const montosTablaMap = Object.fromEntries(montosAjust.map(i => [i.ticker, i.montoTabla]));

  const ccList    = state.coveredCalls[fundId] || [];
  const ccByStock = new Map(ccList.map(cc => [cc.ticker_stock, cc]));
  const ccCallSet = new Set(ccList.map(cc => cc.ticker_call));

  const filas = [];
  for (const h of holdings) {
    if (ccCallSet.has(h.ticker)) continue;

    const meta        = fondoMeta[h.ticker];
    const instrMoneda = meta?.moneda || 'ARS';
    const { price, live } = calcPrecio(h, meta, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
    const lamina  = meta?.lamina || 1;
    const cierre  = h.cierre * lamina;
    const tipo    = meta?.tipo || 'Otros';
    const isShortCall  = SHORT_OPT_TIPOS.includes(tipo);
    const priceDisplay = live ? price : cierre;
    const varPct  = live && cierre > 0
      ? (isShortCall ? cierre / price - 1 : price / cierre - 1)
      : 0;
    const precioInicial = meta?.precioInicial ?? null;
    const varHist = precioInicial > 0
      ? (isShortCall ? precioInicial / priceDisplay - 1 : priceDisplay / precioInicial - 1)
      : null;
    const monto        = h.cantidad * (price / lamina);
    const montoDisplay = montosMap[h.ticker]      ?? monto;
    const montoTabla   = montosTablaMap[h.ticker] ?? monto;

    // Par Covered Call: fila combinada + residual
    if (ccByStock.has(h.ticker)) {
      const cc       = ccByStock.get(h.ticker);
      const h_call   = holdings.find(hh => hh.ticker === cc.ticker_call);
      const m_call   = fondoMeta[cc.ticker_call];
      const ccNombre = cc.nombre || (h.ticker.split(' ')[0] + ' CC');
      const pairedQty   = h_call ? h_call.cantidad : h.cantidad;
      const residualQty = h.cantidad - pairedQty;
      const priceUnit   = lamina > 0 ? priceDisplay / lamina : 0;
      const cierreUnit  = lamina > 0 ? cierre / lamina : 0;
      let callMonto = 0;
      if (h_call && m_call) {
        const { price: cp } = calcPrecio(h_call, m_call, moneda, state.fxLive, state.fxAyer, state.marketMap, state.usMap, state.canje, state.yahooMap);
        const cl = m_call.lamina || 1;
        callMonto = h_call.cantidad * (cp / cl);
      }
      const netMonto = pairedQty * priceUnit - Math.abs(callMonto);
      const ccNotional = montosAjust.find(i => i._isCoveredCall && i.ticker === h.ticker)?.notional || 0;
      filas.push({
        ticker: ccNombre,
        instrumento: (meta?.denom || h.ticker) + ' ✕ ' + cc.ticker_call,
        nominales: pairedQty, cierre: cierreUnit, actual: priceDisplay, live,
        varPct, varHist, monto: netMonto,
        pctPN: pn > 0 ? (netMonto + ccNotional) / pn : null, moneda: instrMoneda,
      });
      if (residualQty > 0) {
        filas.push({
          ticker: h.ticker,
          instrumento: (meta?.denom || h.ticker) + ' (sin cubrir)',
          nominales: residualQty, cierre: cierreUnit, actual: priceDisplay, live,
          varPct, varHist, monto: residualQty * priceUnit,
          pctPN: pn > 0 ? (residualQty * priceUnit) / pn : null, moneda: instrMoneda,
        });
      }
      continue;
    }

    filas.push({
      ticker: h.ticker,
      instrumento: meta?.denom || h.ticker,
      nominales: h.cantidad, cierre, actual: priceDisplay, live,
      varPct, varHist, monto: montoTabla,
      pctPN: pn > 0 ? montoDisplay / pn : null, moneda: instrMoneda,
    });
  }

  const ajustes = (AJUSTES[fundId] || []).map(a => ({ label: a.label, val: a.val }));
  return {
    cfg, moneda, filas, totalInv, ajustes,
    honorario: fundId === 'PNIZF' ? null : honorario,
    pn, navLive, rend,
  };
}

async function exportarExcel(fundId) {
  cerrarExportMenu();
  const d = calcFilasExport(fundId);
  if (!d) return;
  try {
    await cargarXLSX();
  } catch (e) {
    alert('No se pudo cargar la librería de Excel. Revisá la conexión a internet.');
    return;
  }

  const aoa = [];
  aoa.push([d.cfg.nombre + ' — Composición de cartera']);
  aoa.push(['Fecha', fechaArgStr(), '', 'NAV live', d.navLive, '', 'PN live (' + d.moneda + ')', d.pn]);
  aoa.push([]);
  const HEADER_ROW = 3; // índice (0-based) de la fila de encabezados
  aoa.push(['Ticker', 'Instrumento', 'Nominales', 'Px cierre', 'Px actual', 'Estado', 'Var %', 'Var Hist.', 'Monto ' + d.moneda, '% Patrim.', 'Moneda instr.']);
  for (const f of d.filas) {
    aoa.push([
      f.ticker, f.instrumento, f.nominales, f.cierre, f.actual,
      f.live ? 'LIVE' : 'CIERRE',
      f.varPct, f.varHist ?? '', f.monto, f.pctPN ?? '', f.moneda,
    ]);
  }
  aoa.push([]);
  aoa.push(['SUBTOTAL CARTERA', '', '', '', '', '', '', '', d.totalInv]);
  for (const a of d.ajustes) aoa.push([a.label, '', '', '', '', '', '', '', a.val]);
  if (d.honorario !== null) aoa.push(['(−) Honorarios devengados (1 día)', '', '', '', '', '', '', '', -d.honorario]);
  aoa.push(['PATRIMONIO NETO LIVE', '', '', '', '', '', '', '', d.pn]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [
    { wch: 16 }, { wch: 40 }, { wch: 14 }, { wch: 12 }, { wch: 12 },
    { wch: 9 },  { wch: 10 }, { wch: 10 }, { wch: 18 }, { wch: 10 }, { wch: 13 },
  ];
  // Formatos numéricos
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let R = HEADER_ROW + 1; R <= range.e.r; R++) {
    const setFmt = (c, z) => {
      const cell = ws[XLSX.utils.encode_cell({ r: R, c })];
      if (cell && typeof cell.v === 'number') cell.z = z;
    };
    setFmt(2, '#,##0');       // Nominales
    setFmt(3, '#,##0.00');    // Px cierre
    setFmt(4, '#,##0.00');    // Px actual
    setFmt(6, '+0.00%;-0.00%;0.00%');  // Var %
    setFmt(7, '+0.00%;-0.00%;0.00%');  // Var Hist.
    setFmt(8, '#,##0');       // Monto
    setFmt(9, '0.00%');       // % Patrim.
  }
  // NAV y PN del encabezado
  const c5 = ws[XLSX.utils.encode_cell({ r: 1, c: 4 })]; if (c5) c5.z = '#,##0.0000';
  const c8 = ws[XLSX.utils.encode_cell({ r: 1, c: 7 })]; if (c8) c8.z = '#,##0';

  const wb = XLSX.utils.book_new();
  const sheetName = String(d.cfg.nombre || fundId).replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31) || 'Cartera';
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, `${fundId}_cartera_${fechaArgISO()}.xlsx`);
}

async function init() {
  render(); // pantalla de carga

  try {
    const [fundsConfig, meta, holdings, fxAyer, , historial, opciones, limites, rfParams] = await Promise.all([
      cargarFunds(),
      cargarMeta(),
      cargarHoldings(),
      cargarFxAyer(),
      cargarCoveredCalls(),
      cargarHistorial(),
      cargarOpciones(),
      cargarLimites(),
      cargarRfParams(),
    ]);
    state.limites  = limites;
    state.rfParams = rfParams;
    state.historial = historial;
    state.opciones  = opciones;
    FUNDS_CONFIG   = fundsConfig;
    state.meta     = meta;
    state.holdings = holdings;
    state.fxAyer    = fxAyer.mep;
    state.fxAyerCCL = fxAyer.ccl;
    state.loading   = false;
    render();

    if (dentroHorarioMercado()) {
      const live = await fetchLivePrecios();
      state.fxLive          = live.fxLive;
      state.canje           = live.canje;
      state.marketMap       = live.marketMap;
      state.usMap           = live.usMap;
      state.yahooMap        = live.yahooMap || {};
      state.lastPriceUpdate = new Date();
    }
    await fetchPreciosSubyacentes().catch(() => {});
    render();

    setInterval(async () => {
      if (!dentroHorarioMercado()) { render(); return; }
      const live = await fetchLivePrecios();
      state.fxLive          = live.fxLive;
      state.canje           = live.canje;
      state.marketMap       = live.marketMap;
      state.usMap           = live.usMap;
      state.yahooMap        = live.yahooMap || {};
      state.lastPriceUpdate = new Date();
      await fetchPreciosSubyacentes().catch(() => {});
      render();
    }, 10 * 60_000);

  } catch (e) {
    console.error('[iEB] init error:', e);
    state.loading = false;
    if (Object.keys(FUNDS_CONFIG).length === 0) {
      state.error = e.message;
    }
    render();
  }
}

function loadPDFJS() {

}
